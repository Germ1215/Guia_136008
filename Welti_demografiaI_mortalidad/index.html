<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoevaluación: Mortalidad (Demografía I)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 920px;
      width: 100%;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
      padding: 32px 40px;
      transition: 0.25s;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2b4a;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .subtitle {
      color: #2c5778;
      font-size: 0.95rem;
      border-left: 4px solid #2a7faa;
      padding-left: 16px;
      margin-bottom: 28px;
      background: #eef3f9;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 0.9rem;
      color: #1a405a;
      border-bottom: 1px solid #dce5ed;
      padding-bottom: 14px;
    }
    .question-counter {
      font-weight: 600;
      background: #dce5ed;
      padding: 4px 14px;
      border-radius: 30px;
    }
    .question-box {
      margin-bottom: 30px;
    }
    .qtext {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.6;
      color: #0b2b4a;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e9f2;
      border-radius: 16px;
      padding: 14px 20px;
      transition: 0.15s;
      cursor: pointer;
    }
    .option-item:hover {
      background: #eef4fa;
      border-color: #b0c8dd;
    }
    .option-item.selected {
      background: #e0edf9;
      border-color: #2a7faa;
      box-shadow: 0 0 0 2px rgba(42,127,170,0.15);
    }
    .option-item input[type="radio"] {
      margin-top: 4px;
      accent-color: #1f6e96;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .option-item label {
      font-size: 1rem;
      line-height: 1.5;
      color: #1a334a;
      cursor: pointer;
      flex: 1;
    }
    .feedback-box {
      background: #f0f6fe;
      border-radius: 20px;
      padding: 18px 24px;
      margin: 16px 0 28px 0;
      border-left: 5px solid #2a7faa;
      display: none;
    }
    .feedback-box.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
    }
    .feedback-box.incorrect {
      border-left-color: #c74545;
      background: #fdeeec;
    }
    .feedback-box .fb-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .feedback-box .fb-detail {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #1a334a;
    }
    .feedback-box .fb-detail strong {
      color: #0b2b4a;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: white;
      border: 1.5px solid #b8cdde;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1a405a;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f9fbfd;
    }
    .btn:hover:not(:disabled) {
      background: #e2ecf5;
      border-color: #7fa3be;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1a5f82;
      border-color: #1a5f82;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #134b68;
      border-color: #134b68;
    }
    .btn-outline {
      background: transparent;
      border-color: #b0c8dd;
    }
    .btn-success {
      background: #1f8b4c;
      border-color: #1f8b4c;
      color: white;
    }
    .btn-success:hover:not(:disabled) {
      background: #17733e;
      border-color: #17733e;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .result-summary {
      background: #e2ecf5;
      border-radius: 24px;
      padding: 20px 28px;
      text-align: center;
      margin-top: 16px;
    }
    .result-summary .score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0b2b4a;
    }
    .result-summary .label {
      font-size: 1rem;
      color: #1a405a;
    }
    .hidden {
      display: none !important;
    }
    .mt-2 { margin-top: 12px; }
    .text-muted { color: #4a6a82; }
    @media (max-width: 600px) {
      .container { padding: 24px 18px; }
      h1 { font-size: 1.5rem; }
      .qtext { font-size: 1.05rem; }
      .option-item { padding: 12px 16px; }
      .btn { padding: 8px 18px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>📘 Autoevaluación · Mortalidad</h1>
  <div class="subtitle">Capítulo IV — Demografía I (Welti, 1997) &nbsp;|&nbsp; 50 preguntas de opción múltiple</div>

  <div class="progress">
    <span class="question-counter" id="counterDisplay">1 / 50</span>
    <span id="statusDisplay" style="font-weight: 500;">Responde y verifica</span>
  </div>

  <!-- Pregunta -->
  <div class="question-box" id="questionContainer">
    <div class="qtext" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <!-- Feedback -->
  <div class="feedback-box" id="feedbackBox">
    <div class="fb-title" id="feedbackTitle"></div>
    <div class="fb-detail" id="feedbackDetail"></div>
  </div>

  <!-- Navegación -->
  <div class="nav-buttons">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
      <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="verifyBtn">✓ Verificar</button>
      <button class="btn btn-success" id="resetBtn" style="background:#5a6f82;border-color:#5a6f82;">⟳ Reiniciar</button>
    </div>
  </div>

  <!-- Resultado final -->
  <div id="resultContainer" class="hidden result-summary">
    <div class="label">Porcentaje de aciertos</div>
    <div class="score" id="finalScore">0%</div>
    <div style="margin-top: 8px; font-size:0.95rem;" id="finalMessage"></div>
  </div>
</div>
<script>
  // ----------------------------------------------------------------
  //  BASE DE PREGUNTAS (50) – extraídas rigurosamente del documento
  // ----------------------------------------------------------------
  const questions = [
    // ========== IV.1.a Nociones básicas sobre mortalidad ==========
    {
      id: 1,
      question: 'En Demografía, la mortalidad se define como:',
      options: [
        'A. El conjunto de enfermedades que afectan a una población en un periodo dado.',
        'B. La acción de la muerte sobre los integrantes de una población.',
        'C. La salida de individuos de una población debido a emigración.',
        'D. El proceso biológico de envejecimiento celular.'
      ],
      correct: 1,
      explanation: 'Correcto. El documento indica: "el concepto de mortalidad se emplea para expresar la acción de la muerte sobre los integrantes de una población" (pág. 1). Las otras opciones son definiciones incorrectas o de otros conceptos.'
    },
    {
      id: 2,
      question: 'Una de las características de la mortalidad que la distingue de la fecundidad y la migración es que:',
      options: [
        'A. Es un evento repetitivo a lo largo de la vida.',
        'B. Ocurre una sola vez a cada persona y no es repetitivo.',
        'C. Solo afecta a personas de edad avanzada.',
        'D. Está determinada exclusivamente por factores genéticos.'
      ],
      correct: 1,
      explanation: 'Correcto. "La muerte es un riesgo al que se está expuesto durante toda la vida y es, además, un hecho que ocurre una sola vez a cada persona. Estas características hacen que el estudio no presente algunas complejidades propias de otros fenómenos demográficos que son repetitivos (migración y fecundidad)" (pág. 1).'
    },
    {
      id: 3,
      question: 'Según el texto, existe un consenso general sobre la necesidad de:',
      options: [
        'A. Reducir la mortalidad, posponerla el máximo de tiempo posible.',
        'B. Aumentar la mortalidad para controlar el crecimiento poblacional.',
        'C. Mantener la mortalidad en niveles constantes.',
        'D. Reducir la mortalidad solo en países desarrollados.'
      ],
      correct: 0,
      explanation: 'Correcto. "Existe un criterio consensual, a nivel científico, político y ético, en cuanto a la necesidad de reducir la mortalidad, la que, por definición, es considerada como algo que debe ser pospuesto el máximo de tiempo posible" (pág. 2).'
    },

    // ========== IV.1.b Fuentes de datos ==========
    {
      id: 4,
      question: 'La fuente básica de datos para el estudio de la mortalidad es:',
      options: [
        'A. Los censos de población.',
        'B. Las encuestas demográficas.',
        'C. El sistema de estadísticas vitales.',
        'D. Los registros hospitalarios.'
      ],
      correct: 2,
      explanation: 'Correcto. "La fuente básica de datos para el estudio de la mortalidad es el sistema de estadísticas vitales" (pág. 2).'
    },
    {
      id: 5,
      question: 'Un problema común en las estadísticas vitales de países subdesarrollados es:',
      options: [
        'A. La sobreestimación de las defunciones.',
        'B. La omisión de fallecimientos, que a veces supera el 50%.',
        'C. La falta de registros de nacimientos.',
        'D. La inexistencia de sistemas de registro.'
      ],
      correct: 1,
      explanation: 'Correcto. "La omisión de los fallecimientos, que a veces supera el 50 por ciento" (pág. 2).'
    },
    {
      id: 6,
      question: 'Las técnicas indirectas de estimación de la mortalidad se basan en preguntas incluidas en:',
      options: [
        'A. Estadísticas vitales.',
        'B. Censos y encuestas.',
        'C. Registros parroquiales.',
        'D. Modelos matemáticos puros.'
      ],
      correct: 1,
      explanation: 'Correcto. "Los errores descritos anteriormente han obligado a desarrollar numerosas técnicas de estimación indirecta de la mortalidad a partir de preguntas incluidas en censos y encuestas" (pág. 2).'
    },

    // ========== IV.2.a Tasa bruta de mortalidad ==========
    {
      id: 7,
      question: 'La tasa bruta de mortalidad (TBM) se calcula como:',
      options: [
        'A. (Defunciones en un año / Población total a mitad de año) × 1000.',
        'B. (Defunciones en un año / Población femenina en edad fértil) × 1000.',
        'C. (Defunciones de menores de un año / Nacimientos) × 1000.',
        'D. (Defunciones en un año / Población total al inicio del año) × 1000.'
      ],
      correct: 0,
      explanation: 'Correcto. La fórmula es d = (D_Z / N_{30-VI-Z}) × 1000 (pág. 3).'
    },
    {
      id: 8,
      question: 'La tasa bruta de mortalidad expresa:',
      options: [
        'A. El número de defunciones por cada mil nacimientos.',
        'B. La reducción relativa anual de una población atribuible al fallecimiento de parte de sus miembros.',
        'C. La probabilidad de morir antes de los 5 años.',
        'D. El número promedio de años que vivirá una persona.'
      ],
      correct: 1,
      explanation: 'Correcto. "la tasa bruta de mortalidad expresa la reducción relativa anual de una población atribuible al fallecimiento de parte de sus miembros" (pág. 3).'
    },
    {
      id: 9,
      question: 'Un valor de TBM = 6 por mil en Chile en 1988 significa que:',
      options: [
        'A. Fallecieron 6 personas por cada mil habitantes durante ese año.',
        'B. Fallecieron 6 de cada mil nacidos vivos.',
        'C. La esperanza de vida es de 6 años.',
        'D. El 6% de la población falleció ese año.'
      ],
      correct: 0,
      explanation: 'Correcto. "si en 1988 la tasa bruta de mortalidad en Chile fue de 6; eso significa que hubo 6 fallecimientos por cada mil personas durante ese año" (pág. 4).'
    },
    {
      id: 10,
      question: 'La tasa bruta de mortalidad se ve afectada por:',
      options: [
        'A. La estructura por edad de la población.',
        'B. La estructura por sexo únicamente.',
        'C. La fecundidad de la población.',
        'D. La migración internacional.'
      ],
      correct: 0,
      explanation: 'Correcto. "el valor de este indicador depende de varios factores... la estructura por edades de la población" (pág. 4).'
    },
    {
      id: 11,
      question: '¿Por qué Suecia puede tener una TBM más alta que Costa Rica a pesar de tener menor mortalidad?',
      options: [
        'A. Porque Suecia tiene una población más envejecida.',
        'B. Porque Costa Rica tiene mejor registro de defunciones.',
        'C. Porque Suecia tiene mayor tasa de inmigración.',
        'D. Porque la TBM no es un buen indicador de nivel de mortalidad en ningún caso.'
      ],
      correct: 0,
      explanation: 'Correcto. "una población envejecida contará con un porcentaje de ancianos comparativamente alto... lo que tenderá a elevar la tasa bruta de mortalidad" (pág. 4).'
    },

    // ========== IV.2.b Tasas de mortalidad por edad ==========
    {
      id: 12,
      question: 'Las tasas de mortalidad por edad se calculan como:',
      options: [
        'A. (Defunciones del grupo de edad / Población total) × 1000.',
        'B. (Defunciones del grupo de edad / Población de ese grupo a mitad de año) × 1000.',
        'C. (Defunciones del grupo de edad / Nacimientos del mismo año) × 1000.',
        'D. (Defunciones del grupo de edad / Población femenina) × 1000.'
      ],
      correct: 1,
      explanation: 'Correcto. "n m^x = (n D^x / n N^{30-VI-Z}) × 1000" (pág. 6).'
    },
    {
      id: 13,
      question: 'La tasa de mortalidad para el grupo 15-19 años en Cuba (0.00088) significa que:',
      options: [
        'A. Por cada mil jóvenes de 15-19 años fallecieron 0.88 en el año.',
        'B. Por cada 1000 habitantes fallecieron 0.88 personas de 15-19 años.',
        'C. Por cada 10 mil jóvenes de 15-19 años fallecieron aproximadamente 9 en el año.',
        'D. La probabilidad de morir entre 15 y 19 años es de 0.88%.'
      ],
      correct: 2,
      explanation: 'Correcto. "el valor de la tasa de mortalidad para el grupo 15 a 19 años en Cuba significa que de cada 10 mil efectivos de esa edad, fallecieron en 1987 cerca de 9 personas" (pág. 6).'
    },

    // ========== IV.2.c Esperanza de vida al nacer ==========
    {
      id: 14,
      question: 'La esperanza de vida al nacer se define como:',
      options: [
        'A. El número promedio de años que vivirán los integrantes de una cohorte hipotética sujeta a la mortalidad actual.',
        'B. La edad máxima que puede alcanzar una persona en una población.',
        'C. El número de años que le queda por vivir a una persona de edad exacta 0.',
        'D. La probabilidad de sobrevivir hasta los 65 años.'
      ],
      correct: 0,
      explanation: 'Correcto. "Es el número promedio de años que vivirían los integrantes de una cohorte hipotética de personas que permaneciese sujeta a la mortalidad imperante en la población en estudio desde su nacimiento hasta su extinción" (pág. 7).'
    },
    {
      id: 15,
      question: 'La esperanza de vida al nacer es una medida de tipo:',
      options: [
        'A. Longitudinal.',
        'B. Transversal.',
        'C. Prospectiva.',
        'D. Retrospectiva.'
      ],
      correct: 1,
      explanation: 'Correcto. "Es de tipo transversal, ya que en su cálculo se conjuga la intensidad de la mortalidad en los distintos grupos de edad para un mismo año calendario" (pág. 6).'
    },
    {
      id: 16,
      question: 'La esperanza de vida al nacer es un buen indicador para comparar niveles de mortalidad porque:',
      options: [
        'A. No está afectada por la estructura por edad de la población.',
        'B. Es fácil de calcular sin necesidad de datos.',
        'C. Se basa en la tasa bruta de mortalidad.',
        'D. Refleja la mortalidad de todos los grupos de edad por igual.'
      ],
      correct: 0,
      explanation: 'Correcto. "al estar basada en las tasas de mortalidad por edad, no se ve afectada por la estructura por edades de la población" (pág. 6).'
    },
    {
      id: 17,
      question: 'Cuando la mortalidad es elevada, la esperanza de vida al nacer suele ser:',
      options: [
        'A. Mayor que la esperanza de vida a la edad 1.',
        'B. Menor que la esperanza de vida a la edad 1.',
        'C. Igual a la esperanza de vida a la edad 1.',
        'D. No se relaciona con la esperanza de vida a otras edades.'
      ],
      correct: 1,
      explanation: 'Correcto. "Cuando la mortalidad es relativamente elevada, la esperanza de vida al nacer es menor que la esperanza de vida a la edad exacta 1, porque... la mortalidad infantil tiende a ser alta" (pág. 7).'
    },

    // ========== IV.3.a Mortalidad por edad ==========
    {
      id: 18,
      question: 'La curva de tasas de mortalidad por edad en una población con alta mortalidad tiene forma de:',
      options: [
        'A. J',
        'B. U',
        'C. L',
        'D. S'
      ],
      correct: 1,
      explanation: 'Correcto. "Una representación gráfica de las tasas de mortalidad por edad de una población con una mortalidad alta tiene la forma de la letra U" (pág. 8).'
    },
    {
      id: 19,
      question: 'Cuando la mortalidad desciende, las tasas que lo hacen con mayor rapidez son las de:',
      options: [
        'A. Edades avanzadas (mayores de 65 años).',
        'B. Edades adultas (45-64 años).',
        'C. Primeras edades (infantil y juvenil).',
        'D. Todas las edades por igual.'
      ],
      correct: 2,
      explanation: 'Correcto. "Se ha podido observar que cuando desciende la mortalidad las tasas que lo hacen con mayor rapidez son aquellas correspondientes a las primeras edades" (pág. 8).'
    },
    {
      id: 20,
      question: 'La sobremortalidad hondureña respecto a Suecia es mayor en el grupo de edad:',
      options: [
        'A. 0 años.',
        'B. 1-4 años.',
        'C. 15-24 años.',
        'D. 65 años y más.'
      ],
      correct: 1,
      explanation: 'Correcto. "con un máximo en el grupo 1-4 años cumplidos, ya que la mortalidad en este grupo es casi 40 veces mayor en Honduras que en Suecia" (pág. 8).'
    },

    // ========== IV.3.b Mortalidad por sexo ==========
    {
      id: 21,
      question: 'En general, la mortalidad femenina es menor que la masculina debido a:',
      options: [
        'A. Causas exclusivamente biológicas.',
        'B. Causas biológicas y socioeconómicas.',
        'C. Mayor exposición a enfermedades.',
        'D. Menor esperanza de vida.'
      ],
      correct: 1,
      explanation: 'Correcto. "Por causas biológicas y socioeconómicas, es común que las mujeres presenten una mortalidad menor que los hombres" (pág. 10).'
    },
    {
      id: 22,
      question: 'La sobremortalidad masculina tiende a:',
      options: [
        'A. Disminuir a medida que aumenta la esperanza de vida.',
        'B. Aumentar a medida que aumenta la esperanza de vida.',
        'C. Permanecer constante independientemente del nivel de mortalidad.',
        'D. Ser mayor en países con alta mortalidad infantil.'
      ],
      correct: 1,
      explanation: 'Correcto. "la sobremortalidad masculina tiende a incrementarse a medida que aumenta la esperanza de vida" (pág. 10).'
    },

    // ========== IV.3.c Mortalidad según causas ==========
    {
      id: 23,
      question: 'Las causas de muerte endógenas son aquellas que:',
      options: [
        'A. Provienen de factores externos como infecciones y accidentes.',
        'B. Provienen de la constitución genética, malformaciones congénitas o degeneración por envejecimiento.',
        'C. Son causadas por violencia o traumatismos.',
        'D. Son fácilmente prevenibles con vacunas.'
      ],
      correct: 1,
      explanation: 'Correcto. "Las causas endógenas: provienen de la constitución genética del individuo, de las malformaciones congénitas, del traumatismo provocado por el nacimiento o de la degeneración producida por el envejecimiento del organismo" (pág. 13).'
    },
    {
      id: 24,
      question: 'Cuando la mortalidad desciende, las muertes por causas exógenas (infecciosas y parasitarias) tienden a:',
      options: [
        'A. Aumentar en importancia relativa.',
        'B. Disminuir en importancia relativa.',
        'C. Mantenerse constantes.',
        'D. Desaparecer por completo.'
      ],
      correct: 1,
      explanation: 'Correcto. "Cuando la mortalidad desciende, pierden importancia relativa las muertes por causas exógenas —fundamentalmente las debidas a enfermedades infecciosas y parasitarias" (pág. 13).'
    },
    {
      id: 25,
      question: 'Según el estudio teórico de Naciones Unidas, cuando la esperanza de vida pasa de 40 a 60 años, la proporción de muertes por causas del Grupo I (enfermedades infecciosas y parasitarias):',
      options: [
        'A. Aumenta.',
        'B. Disminuye.',
        'C. Se mantiene constante.',
        'D. Se duplica.'
      ],
      correct: 1,
      explanation: 'Correcto. "Cuando la esperanza de vida al nacer pasa de 40 a 60 años, la proporción de muertes debidas a las causas del grupo I disminuye" (pág. 13).'
    },

    // ========== IV.4.a Introducción a mortalidad infantil ==========
    {
      id: 26,
      question: 'La mortalidad infantil se define como la que ocurre:',
      options: [
        'A. Durante los primeros 28 días de vida.',
        'B. Antes de cumplir un año de edad.',
        'C. Entre el mes y el año de vida.',
        'D. Durante los primeros 5 años de vida.'
      ],
      correct: 1,

  // ============================================================
  //  LÓGICA DE LA APLICACIÓN
  // ============================================================
  let currentIndex = 0;
  let answers = new Array(questions.length).fill(null); // índice de opción seleccionada
  let verified = new Array(questions.length).fill(false);
  let totalCorrect = 0;

  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackBox = document.getElementById('feedbackBox');
  const feedbackTitle = document.getElementById('feedbackTitle');
  const feedbackDetail = document.getElementById('feedbackDetail');
  const counterDisplay = document.getElementById('counterDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultContainer = document.getElementById('resultContainer');
  const finalScore = document.getElementById('finalScore');
  const finalMessage = document.getElementById('finalMessage');

  function renderQuestion(index) {
    const q = questions[index];
    questionText.textContent = q.question;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question';
      radio.value = i;
      radio.checked = (answers[index] === i);
      radio.addEventListener('change', () => {
        if (verified[index]) {
          verified[index] = false;
          feedbackBox.style.display = 'none';
          totalCorrect = computeTotalCorrect();
        }
        answers[index] = i;
        renderQuestion(index);
      });
      const label = document.createElement('label');
      label.textContent = opt;
      div.appendChild(radio);
      div.appendChild(label);
      optionsContainer.appendChild(div);
    });

    counterDisplay.textContent = `${index+1} / ${questions.length}`;
    if (verified[index]) {
      statusDisplay.textContent = '✅ Verificada';
    } else if (answers[index] !== null) {
      statusDisplay.textContent = '⚪ Respondida (sin verificar)';
    } else {
      statusDisplay.textContent = '🔘 Sin responder';
    }

    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === questions.length - 1);

    if (verified[index]) {
      const q = questions[index];
      const isCorrect = (answers[index] === q.correct);
      feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
      feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
      feedbackDetail.innerHTML = q.explanation;
      feedbackBox.style.display = 'block';
    } else {
      feedbackBox.style.display = 'none';
    }

    resultContainer.classList.add('hidden');
  }

  function computeTotalCorrect() {
    let count = 0;
    for (let i = 0; i < questions.length; i++) {
      if (verified[i] && answers[i] === questions[i].correct) count++;
    }
    return count;
  }

  function verifyCurrent() {
    const idx = currentIndex;
    const q = questions[idx];
    if (answers[idx] === null) {
      alert('Por favor, selecciona una opción antes de verificar.');
      return;
    }
    const isCorrect = (answers[idx] === q.correct);
    verified[idx] = true;
    totalCorrect = computeTotalCorrect();

    feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
    feedbackDetail.innerHTML = q.explanation;
    feedbackBox.style.display = 'block';

    renderQuestion(idx);
    statusDisplay.textContent = '✅ Verificada';
  }

  function showFinalResults() {
    const total = questions.length;
    let correct = 0;
    for (let i = 0; i < total; i++) {
      if (verified[i] && answers[i] === questions[i].correct) correct++;
    }
    const percent = Math.round((correct / total) * 100);
    finalScore.textContent = percent + '%';
    let msg = '';
    if (percent >= 90) msg = '¡Excelente! Dominas los conceptos de mortalidad.';
    else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
    else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y fórmulas.';
    else msg = 'Te sugerimos estudiar nuevamente el capítulo y volver a intentarlo.';
    finalMessage.textContent = msg;
    resultContainer.classList.remove('hidden');
  }

  function resetQuiz() {
    answers.fill(null);
    verified.fill(false);
    currentIndex = 0;
    totalCorrect = 0;
    feedbackBox.style.display = 'none';
    resultContainer.classList.add('hidden');
    renderQuestion(0);
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion(currentIndex);
    } else {
      showFinalResults();
    }
  });

  verifyBtn.addEventListener('click', verifyCurrent);
  resetBtn.addEventListener('click', resetQuiz);

  renderQuestion(0);
</script>
