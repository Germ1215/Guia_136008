<script>
    // ----------------------------------------------------------------
    //  50 preguntas basadas en el documento "Generación de información estadística básica en el INEGI"
    //  Fuente: INEGI, 2008, páginas 11–26
    // ----------------------------------------------------------------
    const questions = [
        // ========== 2. Acepciones de estadística, definiciones ==========
        {
            id: 1,
            question: 'Según el documento, la palabra "estadística" tiene dos acepciones. Una se refiere a datos numéricos sobre un conjunto de elementos; la otra, a:',
            options: [
                'A. La disciplina científica que proporciona las bases teóricas y técnicas para la generación y análisis de datos estadísticos.',
                'B. El conjunto de leyes que regulan la producción de información oficial.',
                'C. La técnica de recolección de datos mediante censos y encuestas.',
                'D. El método para interpretar gráficas y tablas estadísticas.'
            ],
            correct: 0,
            explanation: 'Correcto. El texto señala: "la segunda describe a la disciplina científica que proporciona las bases teóricas y técnicas para la generación y el análisis de datos estadísticos." (pág. 11)'
        },
        {
            id: 2,
            question: 'De acuerdo con la OCDE, la estadística se define como:',
            options: [
                'A. "Los datos numéricos relacionados con un agregado de individuos; la ciencia de la colección, análisis e interpretación de dichos datos".',
                'B. "El conjunto de procedimientos para la planeación y ejecución de censos nacionales".',
                'C. "La actividad que permite medir el comportamiento de los fenómenos sociales y económicos".',
                'D. "El sistema de información que integra datos de distintas fuentes para la toma de decisiones".'
            ],
            correct: 0,
            explanation: 'Correcto. El documento cita a la OCDE: "la estadística como los datos numéricos relacionados con un agregado de individuos; la ciencia de la colección, análisis e interpretación de dichos datos". (pág. 11)'
        },
        {
            id: 3,
            question: 'Complete la afirmación: "La información estadística constituye un elemento esencial para el conocimiento de la realidad, pues mediante ella es posible describir, explicar o ________ fenómenos del campo social, económico, demográfico y del medio ambiente."',
            options: [
                'A. predecir',
                'B. controlar',
                'C. modificar',
                'D. administrar'
            ],
            correct: 0,
            explanation: 'Correcto. El texto dice: "mediante ella es posible describir, explicar o predecir fenómenos del campo social, económico, demográfico y en general del medio ambiente". (pág. 11)'
        },
        // ========== 1. Estándares internacionales ==========
        {
            id: 4,
            question: 'Los Principios Fundamentales de las Estadísticas Oficiales fueron adoptados por la Organización de las Naciones Unidas con el propósito de:',
            options: [
                'A. Apoyar el desarrollo de las unidades estadísticas y fortalecer la confianza del público en las estadísticas.',
                'B. Establecer sanciones a los países que no cumplan con los estándares.',
                'C. Crear un sistema único de estadísticas a nivel mundial.',
                'D. Reemplazar a los institutos nacionales de estadística.'
            ],
            correct: 0,
            explanation: 'Correcto. "Con el propósito de apoyar el desarrollo de dichas unidades, así como de fortalecer la confianza del público en las estadísticas y la comprensión de los gobiernos respecto al papel que desempeña la estadística oficial, la Organización de las Naciones Unidas ha adoptado ... los principios siguientes." (pág. 12)'
        },
        {
            id: 5,
            question: 'El Principio 1 de las estadísticas oficiales se refiere a:',
            options: [
                'A. Pertinencia, imparcialidad y acceso equitativo.',
                'B. Normas y ética profesionales.',
                'C. Rendición de cuentas y transparencia.',
                'D. Confidencialidad.'
            ],
            correct: 0,
            explanation: 'Correcto. El Principio 1 establece: "Pertinencia, imparcialidad y acceso equitativo". (pág. 12)'
        },
        {
            id: 6,
            question: 'El Principio 2 de las estadísticas oficiales establece que los organismos de estadística han de decidir con arreglo a consideraciones estrictamente profesionales, incluidos:',
            options: [
                'A. Los principios científicos y la ética profesional.',
                'B. Las políticas de gobierno y los intereses económicos.',
                'C. Las demandas de los usuarios y las restricciones presupuestales.',
                'D. Los acuerdos internacionales y las recomendaciones de la ONU.'
            ],
            correct: 0,
            explanation: 'Correcto. El Principio 2 dice: "Para mantener la confianza en las estadísticas oficiales, los organismos de estadística han de decidir, con arreglo a consideraciones estrictamente profesionales, incluidos los principios científicos y la ética profesional". (pág. 13)'
        },
        {
            id: 7,
            question: 'El Principio 3, "Rendición de cuentas y transparencia", señala que los organismos de estadística han de presentar información conforme a normas científicas sobre:',
            options: [
                'A. Las fuentes, métodos y procedimientos de la estadística.',
                'B. El presupuesto y los gastos del proyecto estadístico.',
                'C. Los nombres de los informantes y sus datos personales.',
                'D. Los resultados preliminares de las encuestas.'
            ],
            correct: 0,
            explanation: 'Correcto. "Para facilitar una interpretación correcta de los datos, los organismos de estadística han de presentar información conforme a normas científicas sobre las fuentes, métodos y procedimientos de la estadística." (pág. 13)'
        },
        {
            id: 8,
            question: 'El Principio 4 otorga a los organismos de estadística el derecho a:',
            options: [
                'A. Formular observaciones sobre interpretaciones erróneas y la utilización indebida de las estadísticas.',
                'B. Modificar los datos para ajustarlos a las necesidades del gobierno.',
                'C. Cobrar por el acceso a la información estadística.',
                'D. Publicar datos sin verificar su calidad.'
            ],
            correct: 0,
            explanation: 'Correcto. "Los organismos de estadística tienen derecho a formular observaciones sobre interpretaciones erróneas y la utilización indebida de las estadísticas." (pág. 13)'
        },
        {
            id: 9,
            question: 'El Principio 5 establece que los datos para fines estadísticos pueden obtenerse de:',
            options: [
                'A. Todo tipo de fuentes, ya sea encuestas estadísticas o registros administrativos.',
                'B. Únicamente de censos nacionales.',
                'C. Exclusivamente de encuestas por muestreo.',
                'D. Solo de registros administrativos gubernamentales.'
            ],
            correct: 0,
            explanation: 'Correcto. "Los datos para fines estadísticos pueden obtenerse de todo tipo de fuentes, ya sea encuestas estadísticas o registros administrativos." (pág. 13)'
        },
        {
            id: 10,
            question: 'El Principio 6 establece que los datos que reúnan los organismos de estadística deben ser:',
            options: [
                'A. Estrictamente confidenciales y utilizarse exclusivamente para fines estadísticos.',
                'B. Públicos y accesibles a cualquier persona.',
                'C. Compartidos con otras dependencias gubernamentales para fines administrativos.',
                'D. Anónimos y de libre uso para cualquier fin.'
            ],
            correct: 0,
            explanation: 'Correcto. "Los datos que reúnan los organismos de estadística para la compilación estadística ... deben ser estrictamente confidenciales y utilizarse exclusivamente para fines estadísticos." (pág. 13)'
        },
        {
            id: 11,
            question: 'El Principio 7 se refiere a que se han de dar a conocer al público:',
            options: [
                'A. Las leyes, reglamentos y medidas que rigen la operación de los sistemas estadísticos.',
                'B. Los datos individuales de los informantes.',
                'C. Los criterios de selección de la muestra.',
                'D. Los presupuestos de los proyectos estadísticos.'
            ],
            correct: 0,
            explanation: 'Correcto. "Se han de dar a conocer al público las leyes, reglamentos y medidas que rigen la operación de los sistemas estadísticos." (pág. 14)'
        },
        {
            id: 12,
            question: 'El Principio 8 señala que la coordinación entre los organismos de estadística a nivel nacional es indispensable para:',
            options: [
                'A. Lograr la coherencia y eficiencia del sistema estadístico.',
                'B. Centralizar la información en una sola entidad.',
                'C. Reducir el número de proyectos estadísticos.',
                'D. Aumentar el presupuesto de cada organismo.'
            ],
            correct: 0,
            explanation: 'Correcto. "La coordinación entre los organismos de estadística a nivel nacional es indispensable para lograr la coherencia y eficiencia del sistema estadístico." (pág. 14)'
        },
        {
            id: 13,
            question: 'El Principio 9 promueve la utilización por los organismos de estadística de cada país de:',
            options: [
                'A. Conceptos, clasificaciones y métodos internacionales.',
                'B. Métodos exclusivamente nacionales.',
                'C. Clasificaciones propias sin referencia internacional.',
                'D. Datos de otros países sin adaptación.'
            ],
            correct: 0,
            explanation: 'Correcto. "La utilización por los organismos de estadística de cada país de conceptos, clasificaciones y métodos internacionales fomenta la coherencia y eficiencia de los sistemas estadísticos a nivel oficial." (pág. 14)'
        },
        {
            id: 14,
            question: 'El Principio 10 se refiere a la:',
            options: [
                'A. Cooperación internacional bilateral y multilateral en la esfera de la estadística.',
                'B. Competencia entre países por la producción estadística.',
                'C. Imposición de estándares por parte de países desarrollados.',
                'D. Eliminación de la cooperación estadística entre países.'
            ],
            correct: 0,
            explanation: 'Correcto. "La cooperación bilateral y multilateral en la esfera de la estadística contribuye a mejorar los sistemas estadísticos oficiales en todos los países." (pág. 14)'
        },
        // ========== 2. Información estadística en México ==========
        {
            id: 15,
            question: 'En México, el interés por disponer de estadísticas sobre la población y sus actividades económicas se remonta a:',
            options: [
                'A. La época prehispánica, como se verifica en códices y jeroglíficos.',
                'B. La época colonial con el Censo de Revillagigedo.',
                'C. El México independiente con la creación de la Dirección General de Estadística.',
                'D. Todas las anteriores son correctas.'
            ],
            correct: 3,
            explanation: 'Correcto. El documento menciona que el interés se remonta a la época prehispánica, continúa en la época colonial con el Censo de Revillagigedo (1790), y se consolida en el México independiente con la creación de la DGE en 1882. (pág. 15)'
        },
        {
            id: 16,
            question: 'El primer censo de población de la ciudad de México, denominado "Censo de Revillagigedo", se realizó en:',
            options: [
                'A. 1790',
                'B. 1824',
                'C. 1882',
                'D. 1977'
            ],
            correct: 0,
            explanation: 'Correcto. "destacándose el llamado Censo de Revillagigedo de 1790." (pág. 15)'
        },
        {
            id: 17,
            question: 'La Dirección General de Estadística (DGE) fue creada en 1882 y adscrita al:',
            options: [
                'A. Ministerio de Fomento.',
                'B. Secretaría de Hacienda.',
                'C. Ministerio de Gobernación.',
                'D. Secretaría de Educación Pública.'
            ],
            correct: 0,
            explanation: 'Correcto. "la voluntad de establecer un servicio estadístico oficial se materializa con la creación de la Dirección General de Estadística (DGE) en 1882, adscrita al Ministerio de Fomento." (pág. 15)'
        },
        {
            id: 18,
            question: 'En 1977 se creó la Coordinación General del Sistema Nacional de Información, que integró los servicios de información estadística y geográfica de:',
            options: [
                'A. La Dirección General de Estadística y la Comisión de Estudios del Territorio Nacional (CETENAL).',
                'B. El INEGI y la Secretaría de Hacienda.',
                'C. El Banco de México y la Secretaría de Economía.',
                'D. La Dirección General de Estadística y el INEGI.'
            ],
            correct: 0,
            explanation: 'Correcto. "se destaca la creación en 1977, de la Coordinación General del Sistema Nacional de Información, que integró los servicios de información estadística y geográfica, ofrecidos hasta entonces en forma independiente por la Dirección General de Estadística y la Comisión de Estudios del Territorio Nacional (CETENAL)." (pág. 15)'
        },
        {
            id: 19,
            question: 'El Instituto Nacional de Estadística, Geografía e Informática (INEGI) se creó en:',
            options: [
                'A. 1983',
                'B. 1980',
                'C. 1977',
                'D. 2008'
            ],
            correct: 0,
            explanation: 'Correcto. "quedando como Instituto Nacional de Estadística, Geografía e Informática (INEGI) según se decretó en 1983". (pág. 15)'
        },
        {
            id: 20,
            question: 'La Ley de Información Estadística y Geográfica (LIEG) que fundamentaba la operación del INEGI fue emitida en:',
            options: [
                'A. 1980 y modificada en 1983.',
                'B. 1977 y modificada en 1980.',
                'C. 1983 y modificada en 2006.',
                'D. 2008 y modificada en 2010.'
            ],
            correct: 0,
            explanation: 'Correcto. "cuya operación se fundamentaba en la Ley de Información Estadística y Geográfica (LIEG) emitida en 1980 y modificada en 1983." (pág. 15)'
        },
        {
            id: 21,
            question: 'En abril de 2006 se emitió el Decreto por el que se reforman los artículos 26 y 73 de la Constitución, estableciendo la Ley del Sistema Nacional de Información Estadística y Geográfica (LSNIEG), que fue publicada en el DOF en:',
            options: [
                'A. abril de 2008.',
                'B. abril de 2006.',
                'C. 2006 pero modificada en 2008.',
                'D. 2010.'
            ],
            correct: 0,
            explanation: 'Correcto. "La nueva Ley señala la creación del Sistema Nacional de Información Estadística y Geográfica (SNIEG) ... publicada en el Diario Oficial de la Federación en abril de 2008." (pág. 16)'
        },
        {
            id: 22,
            question: 'La LSNIEG tiene por objeto regular:',
            options: [
                'A. El SNIEG, los derechos y obligaciones de los Informantes, la organización del INEGI y las faltas administrativas.',
                'B. Únicamente la organización del INEGI.',
                'C. Solo los censos nacionales.',
                'D. Exclusivamente el sistema de cuentas nacionales.'
            ],
            correct: 0,
            explanation: 'Correcto. "La LSNIEG declara que tiene por objeto regular el Sistema Nacional de Información Estadística y Geográfica, los derechos y las obligaciones de los Informantes del Sistema, la organización y el funcionamiento del Instituto Nacional de Estadística y Geografía y las faltas administrativas." (pág. 16)'
        },
        {
            id: 23,
            question: 'El SNIEG se define como el conjunto de Unidades de Estado organizadas a través de los Subsistemas, coordinadas por el INEGI y articuladas mediante:',
            options: [
                'A. La Red Nacional de Información.',
                'B. El Consejo Consultivo Nacional.',
                'C. Los Comités Técnicos Especializados.',
                'D. La Junta de Gobierno.'
            ],
            correct: 0,
            explanation: 'Correcto. "el conjunto de Unidades de Estado organizadas a través de los Subsistemas, coordinadas por el Instituto Nacional de Estadística y Geografía y articuladas mediante la Red Nacional de Información." (pág. 16)'
        },
        {
            id: 24,
            question: 'Las Unidades de Estado son áreas administrativas que cuentan con atribuciones para desarrollar Actividades Estadísticas y Geográficas. Incluyen:',

    // ============================================================
    //  LÓGICA DE LA APLICACIÓN
    // ============================================================
    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);
    let verified = new Array(questions.length).fill(false);
    let totalCorrect = 0;

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackDetail = document.getElementById('feedbackDetail');
    const counterDisplay = document.getElementById('counterDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultContainer = document.getElementById('resultContainer');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');

    function renderQuestion(index) {
        const q = questions[index];
        questionText.textContent = q.question;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'question';
            radio.value = i;
            radio.checked = (answers[index] === i);
            radio.addEventListener('change', () => {
                if (verified[index]) {
                    verified[index] = false;
                    feedbackBox.style.display = 'none';
                    totalCorrect = computeTotalCorrect();
                }
                answers[index] = i;
                renderQuestion(index);
            });
            const label = document.createElement('label');
            label.textContent = opt;
            div.appendChild(radio);
            div.appendChild(label);
            optionsContainer.appendChild(div);
        });

        counterDisplay.textContent = `${index + 1} / ${questions.length}`;
        if (verified[index]) {
            statusDisplay.textContent = '✅ Verificada';
        } else if (answers[index] !== null) {
            statusDisplay.textContent = '⚪ Respondida (sin verificar)';
        } else {
            statusDisplay.textContent = '🔘 Sin responder';
        }

        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === questions.length - 1);

        if (verified[index]) {
            const q = questions[index];
            const isCorrect = (answers[index] === q.correct);
            feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
            feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
            feedbackDetail.innerHTML = q.explanation;
            feedbackBox.style.display = 'block';
        } else {
            feedbackBox.style.display = 'none';
        }

        resultContainer.classList.add('hidden');
    }

    function computeTotalCorrect() {
        let count = 0;
        for (let i = 0; i < questions.length; i++) {
            if (verified[i] && answers[i] === questions[i].correct) count++;
        }
        return count;
    }

    function verifyCurrent() {
        const idx = currentIndex;
        const q = questions[idx];
        if (answers[idx] === null) {
            alert('Por favor, selecciona una opción antes de verificar.');
            return;
        }
        const isCorrect = (answers[idx] === q.correct);
        verified[idx] = true;
        totalCorrect = computeTotalCorrect();

        feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
        feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
        feedbackDetail.innerHTML = q.explanation;
        feedbackBox.style.display = 'block';

        renderQuestion(idx);
        statusDisplay.textContent = '✅ Verificada';
    }

    function showFinalResults() {
        const total = questions.length;
        let correct = 0;
        for (let i = 0; i < total; i++) {
            if (verified[i] && answers[i] === questions[i].correct) correct++;
        }
        const percent = Math.round((correct / total) * 100);
        finalScore.textContent = percent + '%';
        let msg = '';
        if (percent >= 90) msg = '¡Excelente! Dominas los conceptos sobre la generación de información estadística básica en el INEGI.';
        else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
        else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y los principios.';
        else msg = 'Te sugerimos estudiar nuevamente el capítulo y volver a intentarlo.';
        finalMessage.textContent = msg;
        resultContainer.classList.remove('hidden');
    }

    function resetQuiz() {
        answers.fill(null);
        verified.fill(false);
        currentIndex = 0;
        totalCorrect = 0;
        feedbackBox.style.display = 'none';
        resultContainer.classList.add('hidden');
        renderQuestion(0);
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            showFinalResults();
        }
    });

    verifyBtn.addEventListener('click', verifyCurrent);
    resetBtn.addEventListener('click', resetQuiz);

    renderQuestion(0);
</script>
</body>
</html>
