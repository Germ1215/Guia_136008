<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación: Estadísticas de Migraciones Internacionales (ONU)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 6px 12px rgba(0,0,0,0.04);
            padding: 32px 28px;
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .subhead {
            color: #4a5b6e;
            font-size: 0.95rem;
            border-left: 4px solid #2a7de1;
            padding-left: 14px;
            margin-bottom: 24px;
            background: #f0f4fe;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progress-text {
            font-weight: 500;
            color: #1f3a5f;
            background: #e9edf4;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .progress-track {
            flex: 1;
            min-width: 120px;
            height: 6px;
            background: #dfe4ec;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2a7de1;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .question-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 16px;
            margin-bottom: 20px;
            border: 1px solid #eef2f8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            color: #0b1e33;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .relation-list {
            background: #f8faff;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #e2e9f2;
            margin-bottom: 16px;
            font-size: 0.98rem;
            line-height: 1.8;
        }
        .relation-list div {
            padding: 4px 0;
            border-bottom: 1px dashed #eef2f8;
        }
        .relation-list div:last-child {
            border-bottom: none;
        }
        .relation-list code {
            background: #eef4fd;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }
        .definitions-box {
            background: #f0f7ff;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #d0e2f5;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.8;
        }
        .definitions-box div {
            padding: 2px 0;
        }
        .definitions-box .def-label {
            font-weight: 600;
            color: #1f3a5f;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8faff;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #e2e9f2;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option:hover:not(.disabled) {
            background: #eef4fd;
            border-color: #b6cae0;
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2a7de1;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option input[type="radio"]:disabled {
            cursor: not-allowed;
        }
        .option label {
            font-size: 1rem;
            color: #1a2d44;
            cursor: pointer;
            flex: 1;
        }
        .option.disabled {
            opacity: 0.8;
            pointer-events: none;
        }
        .option.correct-option {
            background: #d4edda;
            border-color: #28a745;
        }
        .option.incorrect-option {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .feedback {
            background: #f2f6fc;
            border-radius: 16px;
            padding: 18px 20px;
            margin-top: 6px;
            border-left: 5px solid #2a7de1;
            display: none;
        }
        .feedback.correct {
            border-left-color: #1e9b5e;
            background: #e8f5ee;
        }
        .feedback.incorrect {
            border-left-color: #d14c4c;
            background: #fdeeec;
        }
        .feedback-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .feedback-detail {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1f3a5f;
        }
        .feedback-detail strong {
            color: #0b1e33;
        }
        .feedback-detail ul {
            margin-top: 6px;
            padding-left: 20px;
        }
        .feedback-detail ul li {
            margin-bottom: 4px;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .actions .nav-group {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1f3a5f;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background: #1f3a5f;
            border-color: #1f3a5f;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #142b47;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-outline {
            background: white;
        }
        .btn-outline:hover {
            background: #eef4fd;
        }
        .btn-success {
            background: #1e9b5e;
            border-color: #1e9b5e;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #167d4b;
        }
        .btn-success:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .results {
            margin-top: 28px;
            padding: 24px 20px;
            background: #eef4fe;
            border-radius: 24px;
            text-align: center;
            display: none;
        }
        .results h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1e33;
        }
        .results .score {
            font-size: 3.2rem;
            font-weight: 700;
            color: #1f3a5f;
            margin: 8px 0;
        }
        .results .message {
            font-size: 1rem;
            color: #2d4a6b;
        }
        .restart-btn {
            margin-top: 14px;
            background: #2a7de1;
            border: none;
            color: white;
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
        }
        .restart-btn:hover {
            background: #1a5db5;
        }
        .question-number {
            font-size: 0.9rem;
            color: #4a5b6e;
            margin-bottom: 8px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .question-text {
                font-size: 1rem;
            }
            .option {
                padding: 10px 14px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .actions .nav-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📊 Autoevaluación</h1>
    <div class="subhead">Estadísticas de Migraciones Internacionales · ONU (1999) · 30 preguntas · Párrs. 137-151 (págs. 72-75)</div>

    <div class="progress-bar">
        <span class="progress-text" id="progressLabel">Pregunta 1 / 30</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="questionArea">
        <!-- Se llena dinámicamente -->
    </div>

    <div class="results" id="resultsPanel">
        <h2>📊 Resultado final</h2>
        <div class="score" id="finalScore">0%</div>
        <div class="message" id="finalMessage"></div>
        <button class="restart-btn" onclick="reiniciar()">🔄 Reiniciar cuestionario</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // BANCO DE PREGUNTAS (párrs. 137-151 del documento ONU migraciones)
    // --------------------------------------------------------------
    var preguntasData = [

        {

            explicacion: 'El párrafo 137 dice: "La información que se solicita es el país de ciudadanía actual o de nacionalidad legal del migrante".',

        },

        {

            pregunta: '¿Qué código se recomienda utilizar para clasificar el país de ciudadanía?',

            correcta: 1,
            explicacion: 'El párrafo 137 recomienda: "A efectos de codificación se recomienda utilizar el sistema de codificación numérico que figura en la publicación Códigos Uniformes de País o de Zona para Uso Estadístico".',

            correcta: 1,

        },
        {

                'No solo edad, sino también sexo.',
                'País de origen es otra clasificación, pero el desglose fundamental es sexo.',
                'Nivel educativo es facultativo.'
            ]
        },
        // Párrafo 139: Fecha de nacimiento
        {
            tipo: 'multiple',
            pregunta: 'Según el párrafo 139, ¿qué se recomienda registrar para establecer la edad del migrante?',
            opciones: [
                'Solo el año de nacimiento',

        {

        },
        {
            tipo: 'relacion',
            pregunta: 'Relacione el concepto con su definición según los párrafos 140-143:',

            opciones: [

            ]

                'No es mes, es año.',

        {

            ],
            correcta: 1,

        // Párrafo 149: Lugar previsto de residencia habitual en el país receptor

    // Mezclar preguntas
    function mezclarArray(array) {
        for (var i = array.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
        return array;
    }

    var preguntas = [];
    var indiceActual = 0;
    var respuestas = [];
    var respondidas = [];
    var score = 0;
    var finalizado = false;

    var questionArea = document.getElementById('questionArea');
    var progressLabel = document.getElementById('progressLabel');
    var progressFill = document.getElementById('progressFill');
    var resultsPanel = document.getElementById('resultsPanel');

    function iniciar() {
        // Tomar todas las preguntas y mezclarlas
        preguntas = mezclarArray([].concat(preguntasData));
        indiceActual = 0;
        respuestas = new Array(preguntas.length);
        respondidas = new Array(preguntas.length);
        for (var i = 0; i < preguntas.length; i++) {
            respuestas[i] = undefined;
            respondidas[i] = false;
        }
        score = 0;
        finalizado = false;
        resultsPanel.style.display = 'none';
        renderPregunta();
    }

    function renderPregunta() {
        if (finalizado) return;
        var pregunta = preguntas[indiceActual];
        var total = preguntas.length;
        var num = indiceActual + 1;

        progressLabel.textContent = 'Pregunta ' + num + ' / ' + total;
        progressFill.style.width = ((num / total) * 100) + '%';

        var html = '<div class="question-card">';
        html += '<div class="question-number">Pregunta ' + num + ' / ' + total + '</div>';
        html += '<div class="question-text">' + pregunta.pregunta + '</div>';

        // Si es tipo relación y tiene lista, mostrarla
        if (pregunta.tipo === 'relacion' && pregunta.lista) {
            var items = pregunta.lista.split('\n').filter(function(line) { return line.trim() !== ''; });
            html += '<div class="relation-list">';
            items.forEach(function(item) {
                html += '<div>' + item + '</div>';
            });
            html += '</div>';
        }

        // Si es relación, mostrar definiciones
        if (pregunta.tipo === 'relacion' && pregunta.definiciones) {
            html += '<div class="definitions-box">';
            var letrasDef = ['A', 'B', 'C', 'D'];
            letrasDef.forEach(function(letra) {
                if (pregunta.definiciones[letra]) {
                    html += '<div><span class="def-label">' + letra + '.</span> ' + pregunta.definiciones[letra] + '</div>';
                }
            });
            html += '</div>';
        }

        html += '<div class="options" id="opciones">';

        var letras = ['A', 'B', 'C', 'D'];
        var yaRespondida = respondidas[indiceActual];
        var respuestaSeleccionada = respuestas[indiceActual] || null;
        var correctaLetra = letras[pregunta.correcta];

        pregunta.opciones.forEach(function(texto, idx) {
            var letra = letras[idx];
            var checked = (respuestaSeleccionada === letra) ? 'checked' : '';
            var disabled = yaRespondida ? 'disabled' : '';
            var claseExtra = '';
            if (yaRespondida) {
                if (letra === correctaLetra && letra === respuestaSeleccionada) {
                    claseExtra = 'correct-option';
                } else if (letra === respuestaSeleccionada && letra !== correctaLetra) {
                    claseExtra = 'incorrect-option';
                } else if (letra === correctaLetra) {
                    claseExtra = 'correct-option';
                }
            }
            html += '<div class="option ' + (yaRespondida ? 'disabled' : '') + ' ' + claseExtra + '" id="optCont_' + letra + '">';
            html += '<input type="radio" name="pregunta" value="' + letra + '" id="opt_' + letra + '" ' + checked + ' ' + disabled + '>';
            html += '<label for="opt_' + letra + '"><strong>' + letra + '.</strong> ' + texto + '</label>';
            html += '</div>';
        });

        html += '</div>';

        // Feedback
        var feedbackClass = '';
        var feedbackTitle = '';
        var feedbackDetail = '';
        var mostrarFeedback = false;

        if (yaRespondida) {
            var esCorrecta = (respuestaSeleccionada === correctaLetra);
            if (esCorrecta) {
                feedbackClass = 'correct';
                feedbackTitle = '✅ Correcto';
            } else {
                feedbackClass = 'incorrect';
                feedbackTitle = '❌ Incorrecto';
            }
            var detalle = '<p><strong>Explicación:</strong> ' + pregunta.explicacion + '</p>';
            if (pregunta.distractores) {
                detalle += '<p><strong>Análisis de distractores:</strong></p><ul>';
                pregunta.distractores.forEach(function(d, i) {
                    detalle += '<li><em>' + letras[i] + ':</em> ' + d + '</li>';
                });
                detalle += '</ul>';
            }
            feedbackDetail = detalle;
            mostrarFeedback = true;
        }

        if (mostrarFeedback) {
            html += '<div class="feedback ' + feedbackClass + '" id="feedbackPanel" style="display:block;">';
            html += '<div class="feedback-title">' + feedbackTitle + '</div>';
            html += '<div class="feedback-detail">' + feedbackDetail + '</div>';
            html += '</div>';
        } else {
            html += '<div class="feedback" id="feedbackPanel" style="display:none;"></div>';
        }

        // Botones de navegación
        var hayRespuesta = respuestaSeleccionada !== null;
        var puedeVerificar = !yaRespondida && hayRespuesta;

        html += '<div class="actions">';
        html += '<div class="nav-group">';
        if (indiceActual > 0) {
            html += '<button class="btn btn-outline" onclick="irAPregunta(' + (indiceActual - 1) + ')">◀ Anterior</button>';
        }
        if (indiceActual < total - 1) {
            html += '<button class="btn btn-outline" onclick="irAPregunta(' + (indiceActual + 1) + ')">Siguiente ▶</button>';
        }
        html += '</div>';
        html += '<div class="nav-group">';
        if (puedeVerificar) {
            html += '<button class="btn btn-success" id="btnVerificar" onclick="verificarRespuesta()">Verificar respuesta</button>';
        }
        if (yaRespondida && indiceActual === total - 1) {
            html += '<button class="btn btn-primary" onclick="finalizar()">Ver resultados</button>';
        }
        html += '</div>';
        html += '</div>';

        html += '</div>';
        questionArea.innerHTML = html;

        // Event listeners para los radio buttons
        document.querySelectorAll('input[name="pregunta"]').forEach(function(input) {
            input.addEventListener('change', function(e) {
                if (respondidas[indiceActual]) return;
                var val = this.value;
                respuestas[indiceActual] = val;
                renderPregunta();
            });
        });
    }

    function irAPregunta(nuevoIndice) {
        if (nuevoIndice >= 0 && nuevoIndice < preguntas.length) {
            indiceActual = nuevoIndice;
            renderPregunta();
        }
    }

    function verificarRespuesta() {
        if (respondidas[indiceActual]) return;
        var letra = respuestas[indiceActual];
        if (!letra) return;
        var pregunta = preguntas[indiceActual];
        var letras = ['A', 'B', 'C', 'D'];
        var correctaLetra = letras[pregunta.correcta];
        var esCorrecta = (letra === correctaLetra);
        if (esCorrecta) score++;
        respondidas[indiceActual] = true;
        renderPregunta();
    }

    function finalizar() {
        finalizado = true;
        var total = preguntas.length;
        var porcentaje = Math.round((score / total) * 100);
        document.getElementById('finalScore').textContent = porcentaje + '%';
        var mensaje = '';
        if (porcentaje >= 90) mensaje = '¡Excelente! Dominas los conceptos de estadísticas de migraciones internacionales.';
        else if (porcentaje >= 70) mensaje = 'Buen trabajo, pero revisa los conceptos clave.';
        else if (porcentaje >= 50) mensaje = 'Es necesario repasar la teoría con más detalle.';
        else mensaje = 'Te recomiendo estudiar nuevamente los párrafos indicados.';
        document.getElementById('finalMessage').textContent = mensaje;
        resultsPanel.style.display = 'block';
        questionArea.innerHTML = '';
        progressLabel.textContent = 'Cuestionario completado';
        progressFill.style.width = '100%';
    }

    function reiniciar() {
        iniciar();
    }

    iniciar();
</script>
