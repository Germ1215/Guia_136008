  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fa;

    }
    .container {
      background: white;
      max-width: 920px;

    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;

      letter-spacing: -0.3px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .subtitle {
      color: #2c5778;

    }
    .progress {
      display: flex;

      margin-bottom: 28px;
      font-size: 0.9rem;
      color: #1a405a;
      border-bottom: 1px solid #dce5ed;
      padding-bottom: 14px;
    }

      font-weight: 600;
      background: #dce5ed;
      padding: 4px 14px;
      border-radius: 30px;
    }

      font-size: 1.25rem;

    }

      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e9f2;

      padding: 14px 20px;
      transition: 0.15s;
      cursor: pointer;
    }
    .option-item:hover {
      background: #eef4fa;
      border-color: #b0c8dd;
    }
    .option-item.selected {
      background: #e0edf9;
      border-color: #2a7faa;
      box-shadow: 0 0 0 2px rgba(42,127,170,0.15);
    }
    .option-item input[type="radio"] {
      margin-top: 4px;
      accent-color: #1f6e96;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .option-item label {
      font-size: 1rem;
      line-height: 1.5;
      color: #1a334a;
      cursor: pointer;
      flex: 1;
    }
    .feedback-box {
      background: #f0f6fe;
      border-radius: 20px;

    }
    .feedback-box.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
    }
    .feedback-box.incorrect {
      border-left-color: #c74545;
      background: #fdeeec;
    }
    .feedback-box .fb-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .feedback-box .fb-detail {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #1a334a;
    }
    .feedback-box .fb-detail strong { color: #0b2b4a; }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: white;

      border-radius: 40px;

      gap: 8px;
      background: #f9fbfd;
    }
    .btn:hover:not(:disabled) {
      background: #e2ecf5;
      border-color: #7fa3be;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1a5f82;
      border-color: #1a5f82;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #134b68;
      border-color: #134b68;
    }
    .btn-outline { background: transparent; border-color: #b0c8dd; }
    .btn-success {
      background: #1f8b4c;
      border-color: #1f8b4c;
      color: white;
    }
    .btn-success:hover:not(:disabled) {
      background: #17733e;
      border-color: #17733e;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .result-summary {
      background: #e2ecf5;
      border-radius: 24px;
      padding: 20px 28px;
      text-align: center;
      margin-top: 16px;
    }
    .result-summary .score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0b2b4a;
    }
    .result-summary .label { font-size: 1rem; color: #1a405a; }
    .hidden { display: none !important; }
    .mt-2 { margin-top: 12px; }
    .text-muted { color: #4a6a82; }
    @media (max-width: 600px) {
      .container { padding: 24px 18px; }
      h1 { font-size: 1.5rem; }

      .btn { padding: 8px 18px; font-size: 0.85rem; }
    }
  </style>

<body>
<div class="container" id="app">
  <h1>📘 Autoevaluación · NOM-035-SSA3-2012</h1>
  <div class="subtitle">Información en Salud — 50 preguntas de opción múltiple</div>

  <div class="progress">
    <span class="question-counter" id="counterDisplay">1 / 50</span>
    <span id="statusDisplay" style="font-weight: 500;">Responde y verifica</span>
  </div>

  <div class="question-box" id="questionContainer">
    <div class="qtext" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <div class="feedback-box" id="feedbackBox">
    <div class="fb-title" id="feedbackTitle"></div>
    <div class="fb-detail" id="feedbackDetail"></div>
  </div>

  <div class="nav-buttons">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
      <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="verifyBtn">✓ Verificar</button>
      <button class="btn btn-success" id="resetBtn" style="background:#5a6f82;border-color:#5a6f82;">⟳ Reiniciar</button>
    </div>
  </div>

  <div id="resultContainer" class="hidden result-summary">
    <div class="label">Porcentaje de aciertos</div>
    <div class="score" id="finalScore">0%</div>
    <div style="margin-top: 8px; font-size:0.95rem;" id="finalMessage"></div>
  </div>
</div>
<script>
  // ----------------------------------------------------------------
  //  50 preguntas basadas en NOM-035-SSA3-2012 (Capítulos 1-10 y Transitorios)
  // ----------------------------------------------------------------
  const questions = [
    // ========== Capítulo 1. Objetivo y campo de aplicación ==========
    {
      id: 1,
      question: 'La NOM-035-SSA3-2012 tiene por objeto establecer los criterios y procedimientos para:',
      options: [
        'A. Regular únicamente la expedición de certificados de defunción.',
        'B. Producir, captar, integrar, procesar, sistematizar, evaluar y divulgar la Información en Salud.',
        'C. Establecer los requisitos de infraestructura hospitalaria.',
        'D. Normar la atención médica en establecimientos privados.'
      ],
      correct: 1,
      explanation: 'Correcto. El numeral 1.1 establece: "Esta norma tiene por objeto establecer los criterios y procedimientos que se deben seguir para producir, captar, integrar, procesar, sistematizar, evaluar y divulgar la Información en Salud." Las otras opciones describen objetos de otras normas o son limitadas.'
    },
    {
      id: 2,
      question: 'El campo de aplicación de la NOM-035-SSA3-2012 es de observancia obligatoria para:',
      options: [
        'A. Solo las instituciones públicas del Sistema Nacional de Salud.',
        'B. Todos los integrantes del Sistema Nacional de Salud que presten servicios de atención a la salud en establecimientos fijos y/o móviles.',
        'C. Únicamente los hospitales de alta especialidad.',
        'D. Las dependencias de la Secretaría de Salud en el ámbito federal.'
      ],
      correct: 1,
      explanation: 'Correcto. El numeral 1.2 indica: "Esta norma es de observancia obligatoria en todo el territorio nacional para todos los integrantes del Sistema Nacional de Salud, que presten servicios de atención a la salud en establecimientos fijos y/o móviles."'
    },

    // ========== Capítulo 2. Referencias ==========
    {
      id: 3,
      question: '¿Cuál de las siguientes normas se menciona como referencia en la NOM-035-SSA3-2012?',
      options: [
        'A. NOM-004-SSA3-2012, del Expediente Clínico.',
        'B. NOM-030-SSA2-2009, para la prevención de la violencia.',
        'C. NOM-001-SSA1-2010, sobre saneamiento básico.',
        'D. NOM-012-SSA3-2012, sobre residuos peligrosos.'
      ],
      correct: 0,
      explanation: 'Correcto. En el numeral 2.3 se cita la "Norma Oficial Mexicana NOM 004-SSA3-2012, del Expediente Clínico." Las otras no se mencionan en el apartado de referencias.'
    },
    {
      id: 4,
      question: 'El Acuerdo por el que se establece el Sistema Nacional de Información Básica en Materia de Salud fue publicado en el DOF el:',
      options: [
        'A. 5 de septiembre de 2012.',
        'B. 30 de noviembre de 2012.',
        'C. 28 de septiembre de 2005.',
        'D. 23 de agosto de 2012.'
      ],
      correct: 0,
      explanation: 'Correcto. En la referencia 2.1 se indica: "Acuerdo por el que se establece el Sistema Nacional de Información Básica en Materia de Salud publicado en el Diario Oficial de la Federación el 5 de septiembre de 2012."'
    },

    // ========== Capítulo 3. Definiciones ==========
    {
      id: 5,
      question: 'Según la definición, la "afección principal" es:',
      options: [
        'A. La primera enfermedad que padece el paciente al ingresar.',
        'B. La situación diagnosticada al final del proceso de atención como la causante primaria de la necesidad de tratamiento.',
        'C. Cualquier síntoma que presente el paciente.',
        'D. La enfermedad que requiere mayor tiempo de hospitalización.'
      ],
      correct: 1,
      explanation: 'Correcto. La definición 3.2 establece: "Afección principal.- Situación diagnosticada al final del proceso de atención de la salud, como la causante primaria de la necesidad de tratamiento o investigación que tuvo el paciente."'
    },
    {
      id: 6,
      question: 'La "cama censable" se caracteriza fundamentalmente porque:',
      options: [
        'A. Genera un Egreso Hospitalario.',
        'B. Se destina a la atención transitoria o provisional.',
        'C. No requiere recursos de personal.',
        'D. Es exclusiva para servicios de urgencias.'
      ],
      correct: 0,
      explanation: 'Correcto. Definición 3.6: "Cama censable.- Su característica fundamental, es que genera un Egreso Hospitalario; ésta se encuentra en el servicio instalado en el área de hospitalización."'
    },
    {
      id: 7,
      question: 'La "causa básica de defunción" se define como:',
      options: [
        'A. La enfermedad que aparece en primer lugar en el certificado.',
        'B. La enfermedad o lesión que inició la cadena de acontecimientos patológicos que condujeron directamente a la muerte.',
        'C. La causa inmediata de la muerte.',
        'D. Cualquier circunstancia que acompañe al deceso.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.8: "Causa básica de defunción.- Enfermedad o lesión que inició la cadena de acontecimientos patológicos que condujeron directamente a la muerte o las circunstancias del accidente o violencia que produjeron la lesión fatal."'
    },
    {
      id: 8,
      question: 'El "Certificado de Nacimiento" es:',
      options: [
        'A. Un documento legal equivalente al Acta de Nacimiento.',
        'B. Un formato único nacional que hace constar el nacimiento de un nacido vivo y las circunstancias que acompañaron el hecho.',
        'C. Un documento que solo se expide en hospitales públicos.',
        'D. Un requisito opcional para el registro civil.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.13: "Certificado de Nacimiento.- Formato único nacional establecido por la Secretaría de Salud, de expedición gratuita y obligatoria, con carácter individual e intransferible, que hace constar el nacimiento de un nacido vivo y las circunstancias que acompañaron el hecho."'
    },
    {
      id: 9,
      question: 'La "defunción materna" se define como la muerte de una mujer:',
      options: [
        'A. Durante el embarazo, parto o dentro de los 42 días siguientes a la terminación del embarazo, por cualquier causa relacionada con el embarazo.',
        'B. Ocurrida durante el parto por causas accidentales.',
        'C. Que fallece por causas no relacionadas con el embarazo dentro del año posterior.',
        'D. Durante el embarazo debido a causas externas.'
      ],
      correct: 0,
      explanation: 'Correcto. Definición 3.28: "Defunción materna.- Muerte de una mujer mientras está embarazada, durante el parto o dentro de los 42 días siguientes a la terminación del embarazo, independientemente de la duración y el sitio del embarazo, debida a cualquier causa relacionada con o agravada por el embarazo mismo o por su atención, pero no por causas accidentales o incidentales."'
    },
    {
      id: 10,
      question: 'Los "días paciente" se cuentan:',
      options: [
        'A. Desde el ingreso hasta el egreso del paciente.',
        'B. Entre las horas en que se toma el censo diario (de 12:01 a.m. a 12:01 a.m. del día siguiente).',
        'C. Solo cuando el paciente permanece más de 24 horas.',
        'D. Exclusivamente para pacientes en terapia intensiva.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.30: "Días paciente.- Período de servicios prestados a un paciente interno, entre las horas en que se toma el censo diario, es decir, de 12.01 a.m. a 12.01 a.m. del día siguiente."'
    },
    {
      id: 11,
      question: 'La "discapacidad" según la Convención de los Derechos de las Personas con Discapacidad resulta de:',
      options: [
        'A. La interacción entre las personas con deficiencias y las barreras debidas a la actitud y al entorno.',
        'B. Las limitaciones en la actividad y restricciones en la participación.',
        'C. Las deficiencias en las funciones y estructuras corporales.',
        'D. Las condiciones de salud que impiden el trabajo.'
      ],
      correct: 0,
      explanation: 'Correcto. Definición 3.32: "De acuerdo a la Convención de los Derechos de las Personas con Discapacidad, la discapacidad resulta de la interacción entre las personas con deficiencias y las barreras debidas a la actitud y al entorno que evitan su participación plena y efectiva en la sociedad."'
    },
    {
      id: 12,
      question: 'El "egreso hospitalario" implica:',
      options: [
        'A. La salida del paciente del servicio de hospitalización con desocupación de una cama censable.',
        'B. Cualquier movimiento entre servicios dentro del mismo hospital.',
        'C. La salida del paciente por alta voluntaria solamente.',
        'D. La defunción del paciente.'
      ],
      correct: 0,
      explanation: 'Correcto. Definición 3.33: "Egreso hospitalario.- Evento de salida del paciente del servicio de hospitalización que implica la desocupación de una cama censable. Incluye altas por curación, mejoría, traslado a otra unidad hospitalaria, defunción, alta voluntaria o fuga. Excluye movimientos entre diferentes servicios dentro del mismo hospital."'
    },
    {
      id: 13,
      question: 'La "información nominal" se define como:',
      options: [
        'A. Información que no incluye datos personales.',
        'B. Registro de un evento de uso estadístico, recolectado a través de un sistema nominal.',
        'C. Información agregada por institución.',
        'D. Datos anónimos para estudios epidemiológicos.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.42: "Información nominal.- Registro de un evento de uso estadístico, recolectado a través de un sistema nominal."'
    },
    {
      id: 14,
      question: 'El "parto normal" se define como:',
      options: [
        'A. Nacimiento por vía abdominal.',
        'B. Nacimiento por vía vaginal sin alguna variación o complicación.',
        'C. Nacimiento por vía vaginal que requiere fórceps.',
        'D. Nacimiento que requiere maniobras de versión.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.47: "Parto normal.- Nacimiento por vía vaginal sin alguna variación o complicación, como sería la aplicación de maniobras."'
    },
    {
      id: 15,
      question: 'El "personal médico en contacto directo con el paciente" incluye:',
      options: [
        'A. Solo a los médicos especialistas.',
        'B. Médicos generales, especialistas, pasantes, residentes e internos de pregrado.',
        'C. Personal administrativo y de investigación.',
        'D. Exclusivamente a los que realizan cirugías.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.51 a): "Médico en contacto directo con el paciente.- Profesional en salud con título y cédula profesional que realiza actividades propias de su profesión o especialidad, de atención directa a la salud de pacientes; no incluye a los que se desarrollan en áreas de apoyo técnico, investigación, docente y administrativo." El grupo incluye médicos generales y especialistas, odontólogos, pasantes, internos y residentes (9.2.4).'
    },
    {
      id: 16,
      question: 'La "población derechohabiente" se refiere a:',
      options: [
        'A. Personas que reciben atención en instituciones privadas.',
        'B. Personas con derecho a recibir prestaciones en especie y/o dinero conforme a las disposiciones de cada institución de seguridad social.',
        'C. Personas afiliadas al Seguro Popular.',
        'D. Personas que utilizan servicios de salud al menos una vez al año.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.55: "Población derechohabiente.- Personas con derecho a recibir prestaciones en especie y/o en dinero conforme a lo establecido por las disposiciones jurídicas aplicables que rigen cada institución de seguridad social."'
    },
    {
      id: 17,
      question: 'Los "servicios personales de salud" son aquellos que:',
      options: [
        'A. Se aplican al medio ambiente o a la colectividad.',
        'B. Son proporcionados a un solo individuo en forma específica, como consulta externa, hospitalización, urgencias, etc.',
        'C. Incluyen protección contra riesgos sanitarios.',
        'D. Se refieren a promoción y educación para la salud.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.72: "Servicios personales de salud.- Aquéllos que son proporcionados a un solo individuo en forma específica, tales como consulta externa, hospitalización, urgencias, servicios de corta estancia, servicios auxiliares de diagnóstico y tratamiento y actividades que se realizan en la población por personal auxiliar de salud."'
    },
    {
      id: 18,
      question: 'El "Sistema Nacional de Información Básica en Materia de Salud" (SNIBMS) es administrado por:',
      options: [
        'A. El INEGI.',
        'B. La Secretaría de Salud a través de la Dirección General de Información en Salud.',
        'C. El Consejo Nacional de Población.',
        'D. La Comisión Nacional de Protección Social en Salud.'
      ],
      correct: 1,
      explanation: 'Correcto. Definición 3.70: "Sistema Nacional de Información Básica en Materia de Salud.- ... Es administrado por la Secretaría de Salud, en su carácter de coordinadora del Sistema Nacional de Salud, por conducto de la Dirección General de Información en Salud."'
    },

    // ========== Capítulo 4. Abreviaturas ==========
    {
      id: 19,
      question: 'La abreviatura "CIF" corresponde a:',
      options: [
        'A. Clasificación Internacional de Funcionamiento, de la Discapacidad y de la Salud.',
        'B. Centro de Inteligencia en Salud.',
        'C. Clasificación Internacional de Enfermedades.',
        'D. Comité Técnico Especializado Sectorial en Salud.'
      ],
      correct: 0,
      explanation: 'Correcto. En el numeral 4.4 se define: "CIF.- Clasificación Internacional del Funcionamiento, de la Discapacidad y de la Salud. Versión vigente adoptada en el país."'
    },
    {
      id: 20,
      question: 'La abreviatura "CLUES" significa:',
      options: [
        'A. Clave Única de Establecimientos de Salud.',
        'B. Clave Única de Registro de Población.',
        'C. Comité Local de Unidades de Salud.',
        'D. Centro de Información en Salud.'
      ],
      correct: 0,
      explanation: 'Correcto. En el numeral 4.9: "CLUES.- Clave Unica de Establecimientos de Salud."'
    },

    // ========== Capítulo 5. Generalidades ==========
    {
      id: 21,
      question: 'Según la NOM-035, la codificación de las clasificaciones internacionales (CIE, CIF, CIE-MC) debe efectuarse al nivel de:',
      options: [
        'A. Tres dígitos.',
        'B. Cuatro dígitos.',
        'C. Cinco dígitos.',
        'D. Dos dígitos.'
      ],
      correct: 1,
      explanation: 'Correcto. Numeral 5.3: "En todos los casos en los que sea necesario utilizar las clasificaciones internacionales (CIE, CIF y CIE-MC) la codificación debe efectuarse al nivel de cuatro dígitos."'
    },
    {
      id: 22,
      question: 'La instancia que regula y vigila el uso de la Familia de Clasificaciones Internacionales de la OMS en México es:',
      options: [
        'A. La Dirección General de Información en Salud.',
        'B. El Centro Mexicano para la Clasificación de Enfermedades (CEMECE).',
        'C. El INEGI.',
        'D. La Comisión Nacional de Protección Social en Salud.'
      ],
      correct: 1,
      explanation: 'Correcto. Numeral 5.6: "La instancia que regula y vigila el uso de la Familia de Clasificaciones Internacionales de la OMS en México, es el CEMECE."'
    },
    {
      id: 23,
      question: 'Todo establecimiento del Sistema Nacional de Salud debe contar con:',
      options: [
        'A. CLUES.',
        'B. CURP.',
        'C. CIF.',
        'D. CIE.'
      ],
      correct: 0,
      explanation: 'Correcto. Numeral 5.5: "Todo establecimiento del SNS debe contar con CLUES."'
    },
    {
      id: 24,
      question: 'La información generada por el SNS debe observar los aspectos de confidencialidad y reserva de acuerdo con:',
      options: [
        'A. Solo la Ley Federal de Transparencia.',
        'B. La Ley del SNIEG, la Ley Federal de Transparencia y la Ley Federal de Protección de Datos Personales.',
        'C. Únicamente la Ley General de Salud.',
        'D. La NOM-004-SSA3-2012.'

  // ============================================================
  //  LÓGICA DE LA APLICACIÓN
  // ============================================================
  let currentIndex = 0;
  let answers = new Array(questions.length).fill(null);
  let verified = new Array(questions.length).fill(false);
  let totalCorrect = 0;

  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackBox = document.getElementById('feedbackBox');
  const feedbackTitle = document.getElementById('feedbackTitle');
  const feedbackDetail = document.getElementById('feedbackDetail');
  const counterDisplay = document.getElementById('counterDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultContainer = document.getElementById('resultContainer');
  const finalScore = document.getElementById('finalScore');
  const finalMessage = document.getElementById('finalMessage');

  function renderQuestion(index) {
    const q = questions[index];
    questionText.textContent = q.question;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question';
      radio.value = i;
      radio.checked = (answers[index] === i);
      radio.addEventListener('change', () => {
        if (verified[index]) {
          verified[index] = false;
          feedbackBox.style.display = 'none';
          totalCorrect = computeTotalCorrect();
        }
        answers[index] = i;
        renderQuestion(index);
      });
      const label = document.createElement('label');
      label.textContent = opt;
      div.appendChild(radio);
      div.appendChild(label);
      optionsContainer.appendChild(div);
    });

    counterDisplay.textContent = `${index+1} / ${questions.length}`;
    if (verified[index]) {
      statusDisplay.textContent = '✅ Verificada';
    } else if (answers[index] !== null) {
      statusDisplay.textContent = '⚪ Respondida (sin verificar)';
    } else {
      statusDisplay.textContent = '🔘 Sin responder';
    }

    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === questions.length - 1);

    if (verified[index]) {
      const q = questions[index];
      const isCorrect = (answers[index] === q.correct);
      feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
      feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
      feedbackDetail.innerHTML = q.explanation;
      feedbackBox.style.display = 'block';
    } else {
      feedbackBox.style.display = 'none';
    }

    resultContainer.classList.add('hidden');
  }

  function computeTotalCorrect() {
    let count = 0;
    for (let i = 0; i < questions.length; i++) {
      if (verified[i] && answers[i] === questions[i].correct) count++;
    }
    return count;
  }

  function verifyCurrent() {
    const idx = currentIndex;
    const q = questions[idx];
    if (answers[idx] === null) {
      alert('Por favor, selecciona una opción antes de verificar.');
      return;
    }
    const isCorrect = (answers[idx] === q.correct);
    verified[idx] = true;
    totalCorrect = computeTotalCorrect();

    feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
    feedbackDetail.innerHTML = q.explanation;
    feedbackBox.style.display = 'block';

    renderQuestion(idx);
    statusDisplay.textContent = '✅ Verificada';
  }

  function showFinalResults() {
    const total = questions.length;
    let correct = 0;
    for (let i = 0; i < total; i++) {
      if (verified[i] && answers[i] === questions[i].correct) correct++;
    }
    const percent = Math.round((correct / total) * 100);
    finalScore.textContent = percent + '%';
    let msg = '';
    if (percent >= 90) msg = '¡Excelente! Dominas los conceptos de la NOM-035-SSA3-2012.';
    else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
    else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y procedimientos.';
    else msg = 'Te sugerimos estudiar nuevamente la norma y volver a intentarlo.';
    finalMessage.textContent = msg;
    resultContainer.classList.remove('hidden');
  }

  function resetQuiz() {
    answers.fill(null);
    verified.fill(false);
    currentIndex = 0;
    totalCorrect = 0;
    feedbackBox.style.display = 'none';
    resultContainer.classList.add('hidden');
    renderQuestion(0);
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion(currentIndex);
    } else {
      showFinalResults();
    }
  });

  verifyBtn.addEventListener('click', verifyCurrent);
  resetBtn.addEventListener('click', resetQuiz);

  renderQuestion(0);
</script>
