</head>
<body>
<div class="container" id="app">
    <h1>📊 Norma Técnica para la Generación de Estadística Básica</h1>
    <div class="subtitle">SNIEG 2010 — Autoevaluación de 50 preguntas</div>

    <div class="progress">
        <span class="question-counter" id="counterDisplay">1 / 50</span>
        <span id="statusDisplay" style="font-weight: 500;">Responde y verifica</span>
    </div>

    <div class="question-box" id="questionContainer">
        <div class="qtext" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
    </div>

    <div class="feedback-box" id="feedbackBox">
        <div class="fb-title" id="feedbackTitle"></div>
        <div class="fb-detail" id="feedbackDetail"></div>
    </div>

    <div class="nav-buttons">
        <div class="btn-group">
            <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
            <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="verifyBtn">✓ Verificar</button>
            <button class="btn btn-success" id="resetBtn" style="background:#5a6f82;border-color:#5a6f82;">⟳ Reiniciar</button>
        </div>
    </div>

    <div id="resultContainer" class="hidden result-summary">
        <div class="label">Porcentaje de aciertos</div>
        <div class="score" id="finalScore">0%</div>
        <div style="margin-top: 8px; font-size:0.95rem;" id="finalMessage"></div>
    </div>
</div>
<script>
    // ----------------------------------------------------------------
    //  50 preguntas basadas en la Norma Técnica para la Generación de Estadística Básica (SNIEG, 2010)
    //  Capítulos I a X y Transitorios (páginas 2 a 8)
    // ----------------------------------------------------------------
    const questions = [
        // ========== Capítulo I - Definiciones (Artículo 3) ==========
        {
            id: 1,
            question: 'Según la Norma Técnica, el "Aprovechamiento de Registros Administrativos" se define como:',
            options: [
                'A. Método de generación de información estadística mediante el uso de registros sobre hechos o elementos existentes que realizan las Unidades del Estado como parte de su función.',
                'B. Serie de actividades para obtener datos a nivel de las unidades de observación.',
                'C. Método de generación de información estadística mediante la captación de datos de cada uno de los elementos del conjunto objeto de estudio.',
                'D. Conjunto de procedimientos de registro, análisis y evaluación de las actividades de un proyecto.'
            ],
            correct: 0,
            explanation: 'Correcto. El Artículo 3, fracción I define: "Aprovechamiento de Registros Administrativos: Método de generación de información estadística, mediante el uso de los registros sobre hechos o elementos existentes, que realizan las Unidades del Estado como parte de su función."'
        },
        {
            id: 2,
            question: 'La "Captación" se define como:',
            options: [
                'A. Conjunto de procedimientos de registro, análisis y evaluación de las actividades de un proyecto.',
                'B. Serie de actividades para obtener los datos a nivel de las unidades de observación, conforme a determinado método de generación de estadísticas.',
                'C. Método de generación de información estadística mediante la obtención de datos de cada elemento que conforma el conjunto objeto de estudio.',
                'D. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.'
            ],
            correct: 1,
            explanation: 'Correcto. El Artículo 3, fracción II: "Captación: Serie de actividades para obtener los datos a nivel de las unidades de observación, conforme a determinado método de generación de estadísticas."'
        },
        {
            id: 3,
            question: 'El "Censo" se define como:',
            options: [
                'A. Método para generar información estadística mediante la captación de datos para un subconjunto de unidades seleccionadas.',
                'B. Método de generación de información estadística, mediante la obtención de datos de cada uno de los elementos que conforman el conjunto objeto de estudio.',
                'C. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'D. Conjunto de actividades ordenadas y relacionadas para producir o integrar información estadística.'
            ],
            correct: 1,
            explanation: 'Correcto. El Artículo 3, fracción III: "Censo: Método de generación de información estadística, mediante la obtención de datos de cada uno de los elementos que conforman el conjunto objeto de estudio. En determinados contextos puede denominarse inventario."'
        },
        {
            id: 4,
            question: 'El "Control administrativo" se define como:',
            options: [
                'A. Conjunto de procedimientos de registro, análisis y evaluación de las actividades de un proyecto, con referencia al programa en que se basa su realización.',
                'B. Serie de actividades para obtener los datos a nivel de las unidades de observación.',
                'C. Método de generación de información estadística mediante el uso de registros administrativos.',
                'D. Conjunto de actividades para identificar, en la información captada, los datos que cumplen con los requisitos de congruencia.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción IV: "Control administrativo: Conjunto de procedimientos de registro, análisis y evaluación de las actividades de un proyecto, con referencia al programa en que se basa su realización."'
        },
        {
            id: 5,
            question: 'El "Cuestionario" se define como:',
            options: [
                'A. Instrumento de captación que presenta preguntas e indicaciones para el registro de datos de las unidades de observación.',
                'B. Formato en medio impreso o electrónico diseñado para el registro de datos.',
                'C. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'D. Método de generación de información estadística mediante la captación de datos de cada uno de los elementos del conjunto objeto de estudio.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción V: "Cuestionario: Tipo de instrumento de captación que presenta, bajo un orden determinado, las preguntas e indicaciones necesarias para el registro de los datos correspondientes a las unidades de observación, en un proyecto de generación de estadística básica."'
        },
        {
            id: 6,
            question: 'El "Diseño conceptual" se define como:',
            options: [
                'A. Serie de actividades para identificar las necesidades de información y determinar el marco conceptual, los instrumentos de captación, los criterios de validación y la presentación de resultados.',
                'B. Serie de actividades para determinar, desarrollar y probar las estrategias para el levantamiento de los datos.',
                'C. Conjunto de actividades mediante las cuales se determinan el método de muestreo y el tamaño de la muestra.',
                'D. Serie de actividades para determinar, desarrollar y probar estrategias y procedimientos para la validación de los datos captados.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción VI: "Diseño conceptual: Serie de actividades para identificar las necesidades de información y determinar, el marco conceptual, los instrumentos de captación, los criterios de validación y la presentación de resultados."'
        },
        {
            id: 7,
            question: 'El "Diseño de la captación" se define como:',
            options: [
                'A. Serie de actividades para determinar, desarrollar y probar las estrategias para el levantamiento de los datos, así como los procedimientos y sistemas para su seguimiento y control.',
                'B. Serie de actividades para identificar las necesidades de información y determinar el marco conceptual.',
                'C. Conjunto de actividades mediante las cuales se determinan el método de muestreo y los procedimientos de selección.',
                'D. Serie de actividades para determinar, desarrollar y probar estrategias y procedimientos para la validación de los datos captados.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción VII: "Diseño de la captación: Serie de actividades para determinar, desarrollar y probar las estrategias para el levantamiento de los datos, así como los procedimientos y sistemas para su seguimiento y control."'
        },
        {
            id: 8,
            question: 'El "Diseño del procesamiento" se define como:',
            options: [
                'A. Serie de actividades para determinar, desarrollar y probar estrategias y procedimientos que habrán de aplicarse para la validación de los datos captados y la generación de resultados estadísticos.',
                'B. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'C. Conjunto de actividades para determinar el método de muestreo y el tamaño de la muestra.',
                'D. Serie de actividades para la elaboración de productos a partir de la información estadística generada.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción VIII: "Diseño del procesamiento: Serie de actividades para determinar, desarrollar y probar estrategias y procedimientos que habrán de aplicarse para la validación de los datos captados y la generación de resultados estadísticos."'
        },
        {
            id: 9,
            question: 'El "Diseño de la muestra" se define como:',
            options: [
                'A. Conjunto de actividades mediante las cuales se determinan el método de muestreo por aplicar, el tamaño de la muestra y los procedimientos de selección así como los elementos técnicos para la determinación de estimadores.',
                'B. Serie de actividades para determinar, desarrollar y probar las estrategias para el levantamiento de los datos.',
                'C. Serie de actividades para identificar las necesidades de información y determinar el marco conceptual.',
                'D. Serie de actividades para determinar, desarrollar y probar estrategias para la validación de los datos.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción IX: "Diseño de la muestra: Conjunto de actividades mediante las cuales se determinan el método de muestreo por aplicar, el tamaño de la muestra y los procedimientos de selección así como los elementos técnicos para la determinación de estimadores."'
        },
        {
            id: 10,
            question: 'La "Encuesta por muestreo" se define como:',
            options: [
                'A. Método para generar información estadística mediante la captación de datos para un subconjunto de unidades seleccionadas de la población objeto de estudio.',
                'B. Método de generación de información estadística mediante la obtención de datos de cada uno de los elementos que conforman el conjunto objeto de estudio.',
                'C. Método de generación de información estadística mediante el uso de registros sobre hechos o elementos existentes.',
                'D. Serie de actividades para obtener los datos a nivel de las unidades de observación.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción X: "Encuesta por muestreo: Método para generar información estadística mediante la captación de datos para un subconjunto de unidades seleccionadas de la población objeto de estudio."'
        },
        {
            id: 11,
            question: 'La "Estadística básica" se define como:',
            options: [
                'A. Información generada a partir de un conjunto de datos obtenidos de un proyecto censal, de una encuesta por muestreo o del aprovechamiento de registros administrativos.',
                'B. Información que se determine como tal por la Junta de Gobierno en términos de la LSNIEG.',
                'C. Conjunto de procedimientos y actividades para producir estadísticas a partir de la aplicación de un instrumento de captación.',
                'D. Serie de actividades para la elaboración de productos a partir de la información estadística generada.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XI: "Estadística básica: Información generada a partir de un conjunto de datos obtenidos de un proyecto censal, de una encuesta por muestreo o del aprovechamiento de registros administrativos."'
        },
        {
            id: 12,
            question: 'La "Evaluación" se define como:',
            options: [
                'A. Conjunto de procedimientos de seguimiento y control, que permiten la verificación y medición del cumplimiento de los objetivos establecidos en un proyecto estadístico y cada una de sus fases.',
                'B. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'C. Conjunto de actividades para identificar datos que cumplen con los requisitos de congruencia y completez.',
                'D. Proceso para determinar los objetivos y estrategia de un proyecto, así como la secuencia de actividades.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XII: "Evaluación: Conjunto de procedimientos de seguimiento y control, que permiten la verificación y medición del cumplimiento de los objetivos establecidos en un proyecto estadístico y cada una de sus fases."'
        },
        {
            id: 13,
            question: 'Una "Fase del proceso para la generación de estadísticas" se define como:',
            options: [
                'A. Cada una de las series de actividades que se distinguen por su naturaleza técnica específica y los momentos de realización, dado un programa y calendario del proyecto estadístico.',
                'B. El conjunto de actividades ordenadas y relacionadas para producir o integrar información estadística.',
                'C. El proceso para determinar los objetivos y estrategia de un proyecto.',
                'D. La serie de actividades para la elaboración de productos a partir de la información estadística generada.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XIII: "Fase del proceso para la generación de estadísticas: Cada una de las series de actividades que se distinguen por su naturaleza técnica específica y los momentos de realización, dado un programa y calendario del proyecto estadístico."'
        },
        {
            id: 14,
            question: 'La "Información de Interés Nacional" se define como:',
            options: [
                'A. Información que se determine como tal por la Junta de Gobierno, en términos de lo dispuesto por los artículos 77, fracción II y 78 de la Ley del SNIEG.',
                'B. Información generada a partir de un conjunto de datos obtenidos de un proyecto censal o encuesta por muestreo.',
                'C. Conjunto de procedimientos y actividades para producir estadísticas a partir de la aplicación de un instrumento de captación.',
                'D. Serie de actividades para la elaboración de productos a partir de la información estadística generada.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XIV: "Información de Interés Nacional: Información que se determine como tal por la Junta de Gobierno, en términos de lo dispuesto por los artículos 77, fracción II y 78 de la Ley del Sistema Nacional de Información Estadística y Geográfica."'
        },
        {
            id: 15,
            question: 'Un "Instrumento de captación" se define como:',
            options: [
                'A. Formato, en medio impreso o electrónico, diseñado para el registro de los datos que han de obtenerse de las unidades de observación, en un proyecto de generación de estadística básica.',

                'C. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'D. Conjunto de procedimientos de registro, análisis y evaluación de las actividades de un proyecto.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XV: "Instrumento de captación: Formato, en medio impreso o electrónico, diseñado para el registro de los datos que han de obtenerse de las unidades de observación, en un proyecto de generación de estadística básica."'
        },
        {
            id: 16,
            question: 'El "Marco conceptual" se define como:',
            options: [
                'A. Esquema bajo el cual se presenta, en forma ordenada y con los vínculos correspondientes, el conjunto de conceptos referentes a temas, categorías, variables y clasificaciones con sus respectivas definiciones, aplicados en un proyecto de generación de estadísticas.',
                'B. Serie de actividades para identificar las necesidades de información y determinar el marco conceptual.',
                'C. Conjunto de actividades mediante las cuales se determinan el método de muestreo y el tamaño de la muestra.',
                'D. Serie de actividades para la elaboración de productos a partir de la información estadística generada.'
            ],
            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XVI: "Marco conceptual: Esquema bajo el cual se presenta, en forma ordenada y con los vínculos correspondientes, el conjunto de conceptos referentes a temas, categorías, variables y clasificaciones con sus respectivas definiciones, aplicados en un proyecto de generación de estadísticas."'
        },
        {
            id: 17,
            question: 'La "Planeación" se define como:',

                'B. Conjunto de procedimientos de seguimiento y control que permiten la verificación del cumplimiento de los objetivos.',
                'C. Serie de actividades para determinar el marco conceptual y los instrumentos de captación.',
                'D. Serie de actividades para la elaboración de productos a partir de la información estadística generada.'

            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XVII: "Planeación: Proceso para determinar los objetivos y estrategia de un proyecto, así como la secuencia de actividades y su calendarización, los recursos y la organización requeridos para su realización."'
        },
        {

            correct: 0,
            explanation: 'Correcto. Artículo 3, fracción XVIII: "Presentación de resultados: Serie de actividades para la elaboración de productos a partir de la información estadística generada en un proyecto determinado."'

        }

    // ============================================================
    //  LÓGICA DE LA APLICACIÓN
    // ============================================================
    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);
    let verified = new Array(questions.length).fill(false);
    let totalCorrect = 0;

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackDetail = document.getElementById('feedbackDetail');
    const counterDisplay = document.getElementById('counterDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultContainer = document.getElementById('resultContainer');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');

    function renderQuestion(index) {
        const q = questions[index];
        questionText.textContent = q.question;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'question';
            radio.value = i;
            radio.checked = (answers[index] === i);
            radio.addEventListener('change', () => {
                if (verified[index]) {
                    verified[index] = false;
                    feedbackBox.style.display = 'none';
                    totalCorrect = computeTotalCorrect();
                }
                answers[index] = i;
                renderQuestion(index);
            });
            const label = document.createElement('label');
            label.textContent = opt;
            div.appendChild(radio);
            div.appendChild(label);
            optionsContainer.appendChild(div);
        });

        counterDisplay.textContent = `${index + 1} / ${questions.length}`;
        if (verified[index]) {
            statusDisplay.textContent = '✅ Verificada';
        } else if (answers[index] !== null) {
            statusDisplay.textContent = '⚪ Respondida (sin verificar)';
        } else {
            statusDisplay.textContent = '🔘 Sin responder';
        }

        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === questions.length - 1);

        if (verified[index]) {
            const q = questions[index];
            const isCorrect = (answers[index] === q.correct);
            feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
            feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
            feedbackDetail.innerHTML = q.explanation;
            feedbackBox.style.display = 'block';
        } else {
            feedbackBox.style.display = 'none';
        }

        resultContainer.classList.add('hidden');
    }

    function computeTotalCorrect() {
        let count = 0;
        for (let i = 0; i < questions.length; i++) {
            if (verified[i] && answers[i] === questions[i].correct) count++;
        }
        return count;
    }

    function verifyCurrent() {
        const idx = currentIndex;
        const q = questions[idx];
        if (answers[idx] === null) {
            alert('Por favor, selecciona una opción antes de verificar.');
            return;
        }
        const isCorrect = (answers[idx] === q.correct);
        verified[idx] = true;
        totalCorrect = computeTotalCorrect();

        feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
        feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
        feedbackDetail.innerHTML = q.explanation;
        feedbackBox.style.display = 'block';

        renderQuestion(idx);
        statusDisplay.textContent = '✅ Verificada';
    }

    function showFinalResults() {
        const total = questions.length;
        let correct = 0;
        for (let i = 0; i < total; i++) {
            if (verified[i] && answers[i] === questions[i].correct) correct++;
        }
        const percent = Math.round((correct / total) * 100);
        finalScore.textContent = percent + '%';
        let msg = '';
        if (percent >= 90) msg = '¡Excelente! Dominas los conceptos de la Norma Técnica.';
        else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
        else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y disposiciones.';
        else msg = 'Te sugerimos estudiar nuevamente la Norma y volver a intentarlo.';
        finalMessage.textContent = msg;
        resultContainer.classList.remove('hidden');
    }

    function resetQuiz() {
        answers.fill(null);
        verified.fill(false);
        currentIndex = 0;
        totalCorrect = 0;
        feedbackBox.style.display = 'none';
        resultContainer.classList.add('hidden');
        renderQuestion(0);
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            showFinalResults();
        }
    });

    verifyBtn.addEventListener('click', verifyCurrent);
    resetBtn.addEventListener('click', resetQuiz);

    renderQuestion(0);
</script>
</body>
</html>
