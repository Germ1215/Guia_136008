<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación: Guía rápida de población</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 860px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 6px 12px rgba(0, 0, 0, 0.04);
            padding: 32px 28px;
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .subhead {
            color: #4a5b6e;
            font-size: 0.95rem;
            border-left: 4px solid #2a7de1;
            padding-left: 14px;
            margin-bottom: 24px;
            background: #f0f4fe;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progress-text {
            font-weight: 500;
            color: #1f3a5f;
            background: #e9edf4;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .progress-track {
            flex: 1;
            min-width: 120px;
            height: 6px;
            background: #dfe4ec;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2a7de1;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .question-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 16px;
            margin-bottom: 20px;
            border: 1px solid #eef2f8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            color: #0b1e33;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .relation-list {
            background: #f8faff;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #e2e9f2;
            margin-bottom: 20px;
            font-size: 0.98rem;
            line-height: 1.8;
        }
        .relation-list code {
            background: #eef4fd;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8faff;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #e2e9f2;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option:hover:not(.disabled) {
            background: #eef4fd;
            border-color: #b6cae0;
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2a7de1;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option input[type="radio"]:disabled {
            cursor: not-allowed;
        }
        .option label {
            font-size: 1rem;
            color: #1a2d44;
            cursor: pointer;
            flex: 1;
        }
        .option.disabled {
            opacity: 0.8;
            pointer-events: none;
        }
        .option.correct-option {
            background: #d4edda;
            border-color: #28a745;
        }
        .option.incorrect-option {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .feedback {
            background: #f2f6fc;
            border-radius: 16px;
            padding: 18px 20px;
            margin-top: 6px;
            border-left: 5px solid #2a7de1;
            display: none;
        }
        .feedback.correct {
            border-left-color: #1e9b5e;
            background: #e8f5ee;
        }
        .feedback.incorrect {
            border-left-color: #d14c4c;
            background: #fdeeec;
        }
        .feedback-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .feedback-detail {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1f3a5f;
        }
        .feedback-detail strong {
            color: #0b1e33;
        }
        .feedback-detail ul {
            margin-top: 6px;
            padding-left: 20px;
        }
        .feedback-detail ul li {
            margin-bottom: 4px;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1f3a5f;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background: #1f3a5f;
            border-color: #1f3a5f;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #142b47;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-outline {
            background: white;
        }
        .btn-outline:hover {
            background: #eef4fd;
        }
        .results {
            margin-top: 28px;
            padding: 24px 20px;
            background: #eef4fe;
            border-radius: 24px;
            text-align: center;
            display: none;
        }
        .results h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1e33;
        }
        .results .score {
            font-size: 3.2rem;
            font-weight: 700;
            color: #1f3a5f;
            margin: 8px 0;
        }
        .results .message {
            font-size: 1rem;
            color: #2d4a6b;
        }
        .restart-btn {
            margin-top: 14px;
            background: #2a7de1;
            border: none;
            color: white;
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
        }
        .restart-btn:hover {
            background: #1a5db5;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .question-text {
                font-size: 1rem;
            }
            .option {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📊 Autoevaluación</h1>
    <div class="subhead">Guía rápida de población · 50 preguntas · Basado en Haupt & Kane (2003)</div>

    <div class="progress-bar">
        <span class="progress-text" id="progressLabel">Pregunta 1 / 50</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="questionArea">
        <!-- Se llena dinámicamente -->
    </div>

    <div class="results" id="resultsPanel">
        <h2>📊 Resultado final</h2>
        <div class="score" id="finalScore">0%</div>
        <div class="message" id="finalMessage"></div>
        <button class="restart-btn" onclick="reiniciar()">🔄 Reiniciar cuestionario</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // BANCO DE 50 PREGUNTAS basado en páginas 23-45 (PDF)
    // --------------------------------------------------------------
    const banco = [];

    // ---------- CONCEPTOS GENERALES (págs. 8-9, 23-24) ----------
    banco.push({
        tipo: 'multiple',
        pregunta: 'Una tasa demográfica se define como:',
        opciones: [
            'El número absoluto de eventos en una población.',
            'La frecuencia de eventos demográficos dividida entre la población "a riesgo" de sufrir el evento.',
            'La relación entre un subgrupo y la población total.',
            'El número de eventos por cada 100.000 habitantes.'
        ],
        correcta: 1,
        explicacion: 'Según el texto, "la tasa es la frecuencia de los eventos demográficos acaecidos en una población durante un determinado período de tiempo dividida entre la población ‘a riesgo’ de sufrir el evento durante ese período de tiempo". (pág. 8, PDF)',
        distractores: [
            'Esa es la definición de enumeración o cifra bruta.',
            'Esa es la definición de proporción.',
            'Es una forma de expresar algunas tasas, pero no la definición general.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'La razón por sexo se expresa normalmente como:',
        opciones: [
            'El número de mujeres por cada 100 hombres.',
            'El número de hombres por cada 100 mujeres.',
            'La proporción de hombres en la población.',
            'El cociente entre hombres y mujeres multiplicado por 1.000.'
        ],
        correcta: 1,
        explicacion: 'La razón por sexo "es la relación entre el número de hombres y el de mujeres en una población dada, expresada normalmente como el número de hombres por cada 100 mujeres". (pág. 11, PDF)',
        distractores: [
            'Es la inversa de la razón por sexo.',
            'Eso es una proporción, no una razón.',
            'No es la forma habitual; se usa 100, no 1.000.'
        ]
    });

    banco.push({
        tipo: 'completar',
        pregunta: 'La ________ es una estadística que mide eventos acaecidos a una cohorte a través del tiempo, mientras que una medida de ________ mide eventos en un período de tiempo determinado.',
        opciones: [
            'medida de cohorte / período',
            'medida de período / cohorte',
            'tasa bruta / tasa específica',
            'razón / proporción'
        ],
        correcta: 0,
        explicacion: 'Se define medida de cohorte como "una estadística que mide los eventos acaecidos a una cohorte ... que se observa a través del tiempo". Y medida de período como "una estadística que mide los eventos acaecidos a la totalidad o parte de una población durante un determinado período de tiempo". (pág. 9, PDF)',
        distractores: [
            'Invierte los conceptos.',
            'No son los términos correctos para esa definición.',
            'No corresponden a la definición dada.'
        ]
    });

    // ---------- FECUNDIDAD (págs. 17-27) ----------
    banco.push({
        tipo: 'multiple',
        pregunta: 'La tasa global de fecundidad (TGF) es:',
        opciones: [
            'El número de nacimientos por cada 1.000 mujeres de 15 a 49 años en un año.',
            'El número promedio de hijos que una mujer tendría al final de sus años reproductivos si se ajustara a las tasas de fecundidad por edad específica de un año determinado.',
            'El número de hijos nacidos vivos a mujeres de una cohorte al final de sus años reproductivos.',
            'La relación entre niños menores de 5 años y mujeres en edad reproductiva.'
        ],
        correcta: 1,
        explicacion: 'La TGF es "el número promedio de hijos que una mujer habría tenido al final de sus años reproductivos si la misma se hubiera ajustado a las tasas de fecundidad por edad específica durante cada año de su vida reproductiva". (pág. 19, PDF)',
        distractores: [
            'Esa es la definición de tasa general de fecundidad.',
            'Esa es la tasa final de fecundidad.',
            'Esa es la razón de niños a mujeres.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'La fecundidad a nivel de reemplazo se alcanza cuando la tasa neta de reproducción es igual a:',
        opciones: ['0,85', '1,00', '1,05', '2,10'],
        correcta: 1,
        explicacion: 'El texto indica: "Una tasa neta de reproducción de 1,00 es igual al nivel de reemplazo". (pág. 23, PDF)',
        distractores: [
            'Es un valor típico de TNR en algunos países, pero no el nivel de reemplazo.',
            'Es un valor superior al nivel de reemplazo.',
            'La TGF de 2,1 se asocia al nivel de reemplazo, pero la TNR es 1,0.'
        ]
    });

    banco.push({
        tipo: 'relacion',
        pregunta: 'Relacione el término con su definición correcta:',
        lista: '1. Tasa bruta de reproducción (TBR)\n2. Tasa neta de reproducción (TNR)\n3. Razón de niños a mujeres',
        opciones: [
            '1-A, 2-B, 3-C',
            '1-B, 2-C, 3-A',
            '1-C, 2-A, 3-B',
            '1-A, 2-C, 3-B'
        ],
        // 1-A: número promedio de hijas (sin considerar mortalidad); 2-B: número promedio de hijas considerando mortalidad; 3-C: niños menores de 5 por 1.000 mujeres
        correcta: 0,
        explicacion: 'TBR: "número promedio de hijas que una mujer tendría durante su vida si se ajustara a las tasas de fecundidad por edad específica". TNR: "número promedio de hijas que nacerían de una mujer si ... se ajustara a las tasas de fecundidad y mortalidad específicas". Razón de niños a mujeres: "número de niños menores de 5 años por 1.000 mujeres en edad reproductiva". (págs. 21, 23, PDF)',
        distractores: [
            'Asignación incorrecta.',
            'Asignación incorrecta.',
            'Asignación incorrecta.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'El porcentaje de mujeres que amamantan es un indicador útil porque:',
        opciones: [
            'Mide directamente la fecundidad.',
            'Ayuda a calcular el número de mujeres que corren el riesgo de quedar embarazadas, ya que la lactancia puede prolongar el período sin menstruación.',
            'Indica el nivel de nutrición infantil.',
            'Es un determinante de la mortalidad infantil.'
        ],
        correcta: 1,
        explicacion: 'El texto señala: "El porcentaje de mujeres que amamantan es útil para calcular el número de mujeres que corren el riesgo de quedar embarazadas, debido a que amamantar exclusivamente a un bebé puede prolongar el período antes de reanudarse la menstruación". (pág. 25, PDF)',
        distractores: [
            'No es una medida directa de fecundidad, sino un factor que la afecta.',
            'No es su función principal en el texto.',
            'No se menciona como determinante de mortalidad infantil.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'La tasa de prevalencia del uso de anticonceptivos se calcula como:',
        opciones: [
            'Número de mujeres que usan anticonceptivos / Número de mujeres en edad reproductiva × 100.',
            'Número de mujeres que usan anticonceptivos / Número de mujeres casadas × 100.',
            'Número de mujeres que usan anticonceptivos modernos / Población total × 100.',
            'Número de nacimientos evitados / Número de mujeres expuestas × 100.'
        ],
        correcta: 0,
        explicacion: 'La tasa de prevalencia es "el número de mujeres en edad reproductiva que están utilizando métodos anticonceptivos por cada 100 mujeres en edad reproductiva". (pág. 26, PDF)',
        distractores: [
            'A veces se calcula para mujeres casadas, pero la definición general usa mujeres en edad reproductiva.',
            'No es la definición estándar; se refiere a mujeres en edad reproductiva, no a toda la población.',
            'No es la definición del texto.'
        ]
    });

    // ---------- MORTALIDAD (págs. 28-34) ----------
    banco.push({
        tipo: 'multiple',
        pregunta: 'La tasa de mortalidad infantil se define como:',
        opciones: [
            'El número de muertes de niños menores de 1 año por cada 1.000 nacidos vivos en un año determinado.',
            'El número de muertes de niños menores de 5 años por cada 1.000 nacidos vivos.',
            'La proporción de muertes infantiles sobre el total de muertes.',
            'El número de muertes de niños durante el primer mes de vida por cada 1.000 nacidos vivos.'
        ],
        correcta: 0,
        explicacion: 'La tasa de mortalidad infantil es "el número de niños menores de 1 año que fallece por cada 1.000 nacidos vivos durante un año determinado". (pág. 30, PDF)',
        distractores: [
            'Esa sería la tasa de mortalidad en la niñez, no infantil.',
            'No es la definición de tasa de mortalidad infantil.',
            'Esa es la tasa de mortalidad neonatal.'
        ]
    });

    banco.push({
        tipo: 'completar',
        pregunta: 'La esperanza de vida al nacer es una medida ________ porque se basa en las tasas de mortalidad actuales, pero las tasas reales cambian con el tiempo.',
        opciones: ['real', 'hipotética', 'observada', 'directa'],
        correcta: 1,
        explicacion: 'El texto dice: "La esperanza de vida es una medida hipotética porque se basa en las tasas de mortalidad actuales, pero las tasas de mortalidad reales cambian durante el transcurso de la vida de una persona". (pág. 31, PDF)',
        distractores: [
            'No es real, es una estimación condicional.',
            'No es observada en el sentido de que no es una medición directa de años vividos.',
            'No es directa porque depende de proyecciones.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'En una tabla de mortalidad, la columna que muestra el número total de "años-persona" que se vivirán durante un período de edad y todos los períodos siguientes se utiliza para calcular:',
        opciones: [
            'La probabilidad de muerte en cada edad.',
            'La esperanza de vida.',
            'La tasa de mortalidad por edad específica.',
            'La razón de dependencia.'
        ],
        correcta: 1,
        explicacion: 'La columna 5 (años-persona acumulados) dividida por el número de personas vivas al comienzo del período da la esperanza de vida. (pág. 32-33, PDF)',
        distractores: [
            'La probabilidad de muerte se muestra en la columna 1.',
            'La tasa por edad se obtiene de los datos observados, no de esa columna.',
            'La razón de dependencia usa grupos de edad, no años-persona.'
        ]
    });

    banco.push({
        tipo: 'relacion',
        pregunta: 'Relacione la medida de mortalidad con su definición:',
        lista: '1. Tasa de mortalidad por causas específicas\n2. Razón de mortalidad materna\n3. Tasa de letalidad',
        opciones: [
            '1-A, 2-B, 3-C',
            '1-B, 2-C, 3-A',
            '1-C, 2-A, 3-B',
            '1-A, 2-C, 3-B'
        ],
        // 1-A: muertes por una causa específica / 100.000 habitantes; 2-B: muertes maternas / 100.000 nacidos vivos; 3-C: proporción de personas que contraen una enfermedad y mueren por ella
        correcta: 0,
        explicacion: 'Tasa de mortalidad por causas específicas: "número de muertes por cada 100.000 habitantes" (pág. 29). Razón de mortalidad materna: "número de mujeres que fallecen ... por cada 100.000 nacidos vivos" (pág. 31). Tasa de letalidad: "proporción de personas que contraen una enfermedad y mueren a causa de la misma" (pág. 35).',
        distractores: [
            'Asignación incorrecta.',
            'Asignación incorrecta.',
            'Asignación incorrecta.'
        ]
    });

    // ---------- MIGRACIÓN (págs. 38-40) ----------
    banco.push({
        tipo: 'multiple',
        pregunta: 'La tasa neta de migración se calcula como:',
        opciones: [
            '(Inmigrantes - Emigrantes) / Población total × 1.000',
            '(Inmigrantes + Emigrantes) / Población total × 1.000',
            'Inmigrantes / Población total × 1.000',
            'Emigrantes / Población total × 1.000'
        ],
        correcta: 0,
        explicacion: 'La tasa neta de migración es "el efecto neto que tienen la inmigración y la emigración en la población de un área, expresado como el aumento o la disminución por cada 1.000 habitantes". Se calcula como (inmigrantes - emigrantes) / población total × 1.000. (pág. 39, PDF)',
        distractores: [
            'Eso sería la tasa bruta de migración, no neta.',
            'Esa es la tasa de inmigración.',
            'Esa es la tasa de emigración.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'La migración neta es:',
        opciones: [
            'La suma de inmigrantes y emigrantes.',
            'El efecto neto de la inmigración y la emigración en la población de un área (aumento o disminución).',
            'El número de inmigrantes menos el número de emigrantes, sin considerar el tamaño de la población.',
            'La diferencia entre la población urbana y rural.'
        ],
        correcta: 1,
        explicacion: 'Migración neta es "el efecto neto que tienen la inmigración y la emigración en la población de un área (aumento o disminución)". (pág. 39, PDF)',
        distractores: [
            'Esa es la migración total, no neta.',
            'Esa es la definición de migración neta en cifras absolutas, pero la definición formal es la del efecto neto.',
            'No tiene relación con la migración.'
        ]
    });

    // ---------- NUPCIALIDAD (págs. 36-37) ----------
    banco.push({
        tipo: 'completar',
        pregunta: 'La edad mediana al primer matrimonio afecta la ________ de la población, y normalmente se calcula por separado para hombres y mujeres.',
        opciones: ['mortalidad', 'fecundidad', 'migración', 'urbanización'],
        correcta: 1,
        explicacion: 'El texto afirma: "La edad mediana al primer matrimonio afecta la fecundidad de la población. La importancia de este factor depende de la medida en que la reproducción se limite al matrimonio". (pág. 36, PDF)',
        distractores: [
            'No es el efecto principal señalado.',
            'No se menciona en ese contexto.',
            'No es el factor que se relaciona directamente.'
        ]
    });

    // ---------- URBANIZACIÓN Y HOGARES (págs. 42-45) ----------
    banco.push({
        tipo: 'multiple',
        pregunta: 'El porcentaje urbano se calcula como:',
        opciones: [
            'Población urbana / Población rural × 100',
            'Población urbana / Población total × 100',
            'Población en ciudades de más de 2.000 habitantes / Población total × 100',
            'Número de áreas metropolitanas / Población total × 100'
        ],
        correcta: 1,
        explicacion: 'El porcentaje urbano es "el número que vive en zonas urbanas ... dividido por la población total, multiplicado por 100". (pág. 44, PDF)',
        distractores: [
            'Eso es una razón urbano-rural, no el porcentaje.',
            'La definición de urbano varía por país, pero el porcentaje se calcula como se indica en la opción B.',
            'No es la definición estándar.'
        ]
    });

    banco.push({
        tipo: 'multiple',
        pregunta: 'El tamaño promedio del hogar se obtiene dividiendo:',
        opciones: [
            'El número de personas que viven en hogares entre el número total de hogares.',
            'El número de familias entre el número de hogares.',
            'La población total entre el número de viviendas.',
            'El número de personas en familias entre el número de familias.'

    // Función para generar 50 preguntas a partir del banco (puedo usar todas)
    function generarPreguntas() {
        // Mezclar el banco para que el orden sea aleatorio
        const shuffled = banco.sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 50); // Tomar 50
    }

    // Estado de la aplicación
    let preguntas = [];
    let indiceActual = 0;
    let respuestas = []; // almacena la letra seleccionada
    let respondidas = []; // booleano
    let score = 0;
    let finalizado = false;

    const questionArea = document.getElementById('questionArea');
    const progressLabel = document.getElementById('progressLabel');
    const progressFill = document.getElementById('progressFill');
    const resultsPanel = document.getElementById('resultsPanel');

    function renderPregunta() {
        if (finalizado) return;
        const pregunta = preguntas[indiceActual];
        const total = preguntas.length;
        const num = indiceActual + 1;

        progressLabel.textContent = `Pregunta ${num} / ${total}`;
        progressFill.style.width = `${(num / total) * 100}%`;

        let html = `<div class="question-card">`;
        html += `<div class="question-text">${pregunta.pregunta}</div>`;

        // Si es tipo relación y tiene lista, mostrarla
        if (pregunta.tipo === 'relacion' && pregunta.lista) {
            const items = pregunta.lista.split('\n').filter(line => line.trim() !== '');
            html += `<div class="relation-list">`;
            items.forEach(item => {
                html += `<div>${item}</div>`;
            });
            html += `</div>`;
        }

        html += `<div class="options" id="opciones">`;

        const letras = ['A', 'B', 'C', 'D'];
        const yaRespondida = respondidas[indiceActual];
        const respuestaSeleccionada = respuestas[indiceActual] || null;
        const correctaLetra = letras[pregunta.correcta];

        pregunta.opciones.forEach((texto, idx) => {
            const letra = letras[idx];
            const checked = (respuestaSeleccionada === letra) ? 'checked' : '';
            const disabled = yaRespondida ? 'disabled' : '';
            let claseExtra = '';
            if (yaRespondida) {
                if (letra === correctaLetra && letra === respuestaSeleccionada) {
                    claseExtra = 'correct-option';
                } else if (letra === respuestaSeleccionada && letra !== correctaLetra) {
                    claseExtra = 'incorrect-option';
                } else if (letra === correctaLetra) {
                    claseExtra = 'correct-option';
                }
            }
            html += `
                <div class="option ${yaRespondida ? 'disabled' : ''} ${claseExtra}" id="optCont_${letra}">
                    <input type="radio" name="pregunta" value="${letra}" id="opt_${letra}" ${checked} ${disabled}>
                    <label for="opt_${letra}"><strong>${letra}.</strong> ${texto}</label>
                </div>
            `;
        });

        html += `</div>`;

        // Feedback
        let feedbackClass = '';
        let feedbackTitle = '';
        let feedbackDetail = '';
        let mostrarFeedback = false;

        if (yaRespondida) {
            const esCorrecta = (respuestaSeleccionada === correctaLetra);
            if (esCorrecta) {
                feedbackClass = 'correct';
                feedbackTitle = '✅ Correcto';
            } else {
                feedbackClass = 'incorrect';
                feedbackTitle = '❌ Incorrecto';
            }
            let detalle = `<p><strong>Explicación:</strong> ${pregunta.explicacion}</p>`;
            if (pregunta.distractores) {
                detalle += `<p><strong>Análisis de distractores:</strong></p><ul>`;
                pregunta.distractores.forEach((d, i) => {
                    detalle += `<li><em>${letras[i]}:</em> ${d}</li>`;
                });
                detalle += `</ul>`;
            }
            feedbackDetail = detalle;
            mostrarFeedback = true;
        }

        if (mostrarFeedback) {
            html += `<div class="feedback ${feedbackClass}" id="feedbackPanel" style="display:block;">`;
            html += `<div class="feedback-title">${feedbackTitle}</div>`;
            html += `<div class="feedback-detail">${feedbackDetail}</div>`;
            html += `</div>`;
        } else {
            html += `<div class="feedback" id="feedbackPanel" style="display:none;"></div>`;
        }

        // Botones
        const hayRespuesta = respuestaSeleccionada !== null;
        html += `<div class="actions">`;
        if (!yaRespondida && hayRespuesta) {
            html += `<button class="btn btn-primary" id="btnVerificar" onclick="verificarRespuesta()">Verificar respuesta</button>`;
        }
        if (yaRespondida && indiceActual < total - 1) {
            html += `<button class="btn btn-primary" onclick="siguientePregunta()">Siguiente →</button>`;
        }
        if (yaRespondida && indiceActual === total - 1) {
            html += `<button class="btn btn-primary" onclick="finalizar()">Ver resultados</button>`;
        }
        html += `</div>`;

        html += `</div>`;
        questionArea.innerHTML = html;

        // Eventos para radio buttons
        document.querySelectorAll('input[name="pregunta"]').forEach(input => {
            input.addEventListener('change', function(e) {
                if (respondidas[indiceActual]) return;
                const val = this.value;
                respuestas[indiceActual] = val;
                renderPregunta();
            });
        });
    }

    function verificarRespuesta() {
        if (respondidas[indiceActual]) return;
        const letra = respuestas[indiceActual];
        if (!letra) return;
        const pregunta = preguntas[indiceActual];
        const letras = ['A', 'B', 'C', 'D'];
        const correctaLetra = letras[pregunta.correcta];
        const esCorrecta = (letra === correctaLetra);
        if (esCorrecta) score++;
        respondidas[indiceActual] = true;
        renderPregunta();
    }

    function siguientePregunta() {
        if (indiceActual < preguntas.length - 1) {
            indiceActual++;
            renderPregunta();
        }
    }

    function finalizar() {
        finalizado = true;
        const total = preguntas.length;
        const porcentaje = Math.round((score / total) * 100);
        document.getElementById('finalScore').textContent = `${porcentaje}%`;
        let mensaje = '';
        if (porcentaje >= 90) mensaje = '¡Excelente! Dominas los conceptos demográficos.';
        else if (porcentaje >= 70) mensaje = 'Buen trabajo, pero revisa los conceptos clave.';
        else if (porcentaje >= 50) mensaje = 'Es necesario repasar la teoría con más detalle.';
        else mensaje = 'Te recomiendo estudiar nuevamente las secciones indicadas.';
        document.getElementById('finalMessage').textContent = mensaje;
        resultsPanel.style.display = 'block';
        questionArea.innerHTML = '';
        progressLabel.textContent = 'Cuestionario completado';
        progressFill.style.width = '100%';
    }

    function reiniciar() {
        preguntas = generarPreguntas();
        indiceActual = 0;
        respuestas = new Array(preguntas.length).fill(undefined);
        respondidas = new Array(preguntas.length).fill(false);
        score = 0;
        finalizado = false;
        resultsPanel.style.display = 'none';
        renderPregunta();
    }

    // Inicializar
    preguntas = generarPreguntas();
    respuestas = new Array(preguntas.length).fill(undefined);
    respondidas = new Array(preguntas.length).fill(false);
    renderPregunta();
</script>
</body>
</html>
