<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoevaluación: Información estadística para el servicio público</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 920px;
      width: 100%;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
      padding: 32px 40px;
      transition: 0.25s;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2b4a;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .subtitle {
      color: #2c5778;
      font-size: 0.95rem;
      border-left: 4px solid #2a7faa;
      padding-left: 16px;
      margin-bottom: 28px;
      background: #eef3f9;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 0.9rem;
      color: #1a405a;
      border-bottom: 1px solid #dce5ed;
      padding-bottom: 14px;
    }
    .question-counter {
      font-weight: 600;
      background: #dce5ed;
      padding: 4px 14px;
      border-radius: 30px;
    }
    .question-box { margin-bottom: 30px; }
    .qtext {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.6;
      color: #0b2b4a;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e9f2;
      border-radius: 16px;
      padding: 14px 20px;
      transition: 0.15s;
      cursor: pointer;
    }
    .option-item:hover {
      background: #eef4fa;
      border-color: #b0c8dd;
    }
    .option-item.selected {
      background: #e0edf9;
      border-color: #2a7faa;
      box-shadow: 0 0 0 2px rgba(42,127,170,0.15);
    }
    .option-item input[type="radio"] {
      margin-top: 4px;
      accent-color: #1f6e96;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .option-item label {
      font-size: 1rem;
      line-height: 1.5;
      color: #1a334a;
      cursor: pointer;
      flex: 1;
    }
    .feedback-box {
      background: #f0f6fe;
      border-radius: 20px;
      padding: 18px 24px;
      margin: 16px 0 28px 0;
      border-left: 5px solid #2a7faa;
      display: none;
    }
    .feedback-box.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
    }
    .feedback-box.incorrect {
      border-left-color: #c74545;
      background: #fdeeec;
    }
    .feedback-box .fb-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .feedback-box .fb-detail {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #1a334a;
    }
    .feedback-box .fb-detail strong { color: #0b2b4a; }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: white;
      border: 1.5px solid #b8cdde;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1a405a;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f9fbfd;
    }
    .btn:hover:not(:disabled) {
      background: #e2ecf5;
      border-color: #7fa3be;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1a5f82;
      border-color: #1a5f82;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #134b68;
      border-color: #134b68;
    }
    .btn-outline { background: transparent; border-color: #b0c8dd; }
    .btn-success {
      background: #1f8b4c;
      border-color: #1f8b4c;
      color: white;
    }
    .btn-success:hover:not(:disabled) {
      background: #17733e;
      border-color: #17733e;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .result-summary {
      background: #e2ecf5;
      border-radius: 24px;
      padding: 20px 28px;
      text-align: center;
      margin-top: 16px;
    }
    .result-summary .score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0b2b4a;
    }
    .result-summary .label { font-size: 1rem; color: #1a405a; }
    .hidden { display: none !important; }
    .mt-2 { margin-top: 12px; }
    .text-muted { color: #4a6a82; }
    @media (max-width: 600px) {
      .container { padding: 24px 18px; }
      h1 { font-size: 1.5rem; }
      .qtext { font-size: 1.05rem; }
      .option-item { padding: 12px 16px; }
      .btn { padding: 8px 18px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>📊 Autoevaluación · Estadística para el servicio público</h1>
  <div class="subtitle">Importancia de la estadística y estándares internacionales (págs. 19-23)</div>

  <div class="progress">
    <span class="question-counter" id="counterDisplay">1 / 30</span>
    <span id="statusDisplay" style="font-weight: 500;">Responde y verifica</span>
  </div>

  <div class="question-box" id="questionContainer">
    <div class="qtext" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <div class="feedback-box" id="feedbackBox">
    <div class="fb-title" id="feedbackTitle"></div>
    <div class="fb-detail" id="feedbackDetail"></div>
  </div>

  <div class="nav-buttons">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
      <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="verifyBtn">✓ Verificar</button>
      <button class="btn btn-success" id="resetBtn" style="background:#5a6f82;border-color:#5a6f82;">⟳ Reiniciar</button>
    </div>
  </div>

  <div id="resultContainer" class="hidden result-summary">
    <div class="label">Porcentaje de aciertos</div>
    <div class="score" id="finalScore">0%</div>
    <div style="margin-top: 8px; font-size:0.95rem;" id="finalMessage"></div>
  </div>
</div>
<script>
  // ----------------------------------------------------------------
  //  30 preguntas basadas en las páginas 19-23 del documento
  //  Temas: Importancia de la estadística, estándares internacionales,
  //  Principios Fundamentales de las Estadísticas Oficiales
  // ----------------------------------------------------------------
  const questions = [
    // ========== 2.1 Importancia de la estadística ==========
    {
      id: 1,
      question: 'Según el documento, la demanda creciente de información ha impulsado el desarrollo de los sistemas estadísticos de las naciones mediante:',
      options: [
        'A. La ejecución de una mayor cantidad y diversidad de proyectos.',
        'B. La reducción de los costos de los censos nacionales.',
        'C. La eliminación de los registros administrativos.',
        'D. La centralización de toda la información en una sola institución.'
      ],
      correct: 0,
      explanation: 'Correcto. El texto indica: "La demanda creciente de información sobre diversos aspectos de la realidad demográfica y socioeconómica en el mundo ha impulsado el desarrollo de los sistemas estadísticos de las naciones, mediante la ejecución de una mayor cantidad y diversidad de proyectos." (pág. 19)'
    },
    {
      id: 2,
      question: 'Las autoridades de gobierno utilizan las estadísticas para, entre otros fines:',
      options: [
        'A. Cuantificar y ubicar necesidades y establecer programas de acción.',
        'B. Generar ingresos fiscales.',
        'C. Reducir el gasto público.',
        'D. Elaborar pronósticos meteorológicos.'
      ],
      correct: 0,
      explanation: 'Correcto. "las autoridades de gobierno en los diferentes niveles y esferas de acción, las utilizan para cuantificar y ubicar necesidades y establecer los programas de acción correspondientes." (pág. 19)'
    },
    {
      id: 3,
      question: 'Las empresas privadas utilizan las estadísticas para:',
      options: [
        'A. Conocer la oferta y demanda de bienes y servicios y sus cambios en el tiempo.',
        'B. Determinar el salario mínimo.',
        'C. Evaluar el desempeño de los funcionarios públicos.',
        'D. Establecer políticas de comercio exterior.'
      ],
      correct: 0,
      explanation: 'Correcto. "las estadísticas facilitan a las empresas privadas el conocimiento de la oferta y demanda de los bienes y servicios y sus cambios en el tiempo." (pág. 19)'
    },
    {
      id: 4,
      question: 'Los investigadores del sector académico utilizan las estadísticas para:',
      options: [
        'A. Conocer los fenómenos en una perspectiva integral de relaciones entre los factores involucrados.',
        'B. Aumentar el presupuesto de sus instituciones.',
        'C. Diseñar campañas políticas.',
        'D. Medir la popularidad de los gobernantes.'
      ],
      correct: 0,
      explanation: 'Correcto. "los investigadores del sector académico utilizan las estadísticas para gran variedad de estudios que permiten conocer los fenómenos en una perspectiva integral de relaciones entre los factores involucrados." (pág. 19)'
    },
    {
      id: 5,
      question: 'El interés de los diferentes usuarios por la información estadística obedece principalmente a que permite adentrarse en aspectos importantes como:',
      options: [
        'A. Su magnitud, estructura, distribución, comportamiento e interrelaciones.',
        'B. Su costo, beneficio, utilidad y rentabilidad.',
        'C. Su origen, destino, trayectoria y finalidad.',
        'D. Su frecuencia, periodicidad, duración y alcance.'
      ],
      correct: 0,
      explanation: 'Correcto. "El interés de los diferentes usuarios por la información estadística obedece principalmente a que permite adentrarse en aspectos importantes de los fenómenos económicos y sociales: su magnitud... su estructura... su distribución... su comportamiento... y sus interrelaciones." (pág. 19)'
    },
    {
      id: 6,
      question: 'Complete la afirmación: "Para que las estadísticas sean de utilidad en cuanto a la caracterización de los fenómenos y al conocimiento de la realidad, deben cumplir determinados requisitos, siendo el principal el de ________."',
      options: [
        'A. veracidad',
        'B. oportunidad',
        'C. accesibilidad',
        'D. comparabilidad'
      ],
      correct: 0,
      explanation: 'Correcto. "Para que las estadísticas sean de utilidad... deben cumplir determinados requisitos, siendo el principal el de veracidad, en el sentido de que los datos correspondan a cuantificaciones con suficiente precisión." (pág. 19)'
    },
    // ========== 2.2 Estándares internacionales ==========
    {
      id: 7,
      question: 'Los Principios Fundamentales de las Estadísticas Oficiales fueron promovidos por:',
      options: [
        'A. La Organización de las Naciones Unidas (ONU).',
        'B. La Organización para la Cooperación y el Desarrollo Económicos (OCDE).',
        'C. El Fondo Monetario Internacional (FMI).',
        'D. La Organización Mundial del Comercio (OMC).'
      ],
      correct: 0,
      explanation: 'Correcto. "la Organización de las Naciones Unidas ha promovido los Principios Fundamentales de las Estadísticas Oficiales." (pág. 20)'
    },
    {
      id: 8,
      question: 'Los Principios Fundamentales de las Estadísticas Oficiales fueron aprobados por la Asamblea General de la ONU en:',
      options: [
        'A. 1994',
        'B. 2006',
        'C. 2014',
        'D. 2010'
      ],
      correct: 2,
      explanation: 'Correcto. "aprobados por la Asamblea General el 29 de enero de 2014." (pág. 21)'
    },
    {
      id: 9,
      question: 'Según el Principio 1, las estadísticas oficiales constituyen un elemento indispensable en el sistema de información de una sociedad democrática y proporcionan al gobierno, a la economía y al público datos acerca de:',
      options: [
        'A. La situación económica, demográfica, social y ambiental.',
        'B. Solo la situación económica y financiera.',
        'C. Exclusivamente los datos demográficos.',
        'D. Únicamente la situación ambiental.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 1. ... proporcionan al gobierno, a la economía y al público datos acerca de la situación económica, demográfica, social y ambiental." (pág. 21)'
    },
    {
      id: 10,
      question: 'El Principio 2 establece que los organismos de estadística han de decidir, con arreglo a consideraciones estrictamente profesionales, acerca de los métodos y procedimientos, incluyendo:',
      options: [
        'A. Los principios científicos y la ética profesional.',
        'B. Las preferencias políticas del gobierno en turno.',
        'C. Los intereses de los grupos empresariales.',
        'D. Las demandas de los medios de comunicación.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 2. ... los organismos de estadística han de decidir, con arreglo a consideraciones estrictamente profesionales, incluidos los principios científicos y la ética profesional." (pág. 21)'
    },
    {
      id: 11,
      question: 'El Principio 3, sobre responsabilidad y transparencia, establece que los organismos de estadística han de presentar información conforme a normas científicas sobre:',
      options: [
        'A. Las fuentes, métodos y procedimientos de la estadística.',
        'B. Los costos y beneficios de los proyectos estadísticos.',
        'C. Las calificaciones del personal estadístico.',
        'D. Los acuerdos de cooperación internacional.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 3. ... los organismos de estadística han de presentar información conforme a normas científicas sobre las fuentes, métodos y procedimientos de la estadística." (pág. 21)'
    },
    {
      id: 12,
      question: 'El Principio 4 otorga a los organismos de estadística el derecho a:',
      options: [
        'A. Formular observaciones sobre interpretaciones erróneas y la utilización indebida de las estadísticas.',
        'B. Modificar los datos para ajustarlos a las expectativas del gobierno.',
        'C. Cobrar por el acceso a la información estadística.',
        'D. Limitar el acceso a los datos a ciertos usuarios.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 4. Los organismos de estadística tienen derecho a formular observaciones sobre interpretaciones erróneas y la utilización indebida de las estadísticas." (pág. 21)'
    },
    {
      id: 13,
      question: 'Según el Principio 5, los datos para fines estadísticos pueden obtenerse de:',
      options: [
        'A. Todo tipo de fuentes, ya sea encuestas estadísticas o registros administrativos.',
        'B. Únicamente de censos nacionales.',
        'C. Exclusivamente de encuestas por muestreo.',
        'D. Solo de registros administrativos gubernamentales.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 5. Los datos para fines estadísticos pueden obtenerse de todo tipo de fuentes, ya sea encuestas estadísticas o registros administrativos." (pág. 22)'
    },
    {
      id: 14,
      question: 'El Principio 6 establece que los datos individuales que reúnan los organismos de estadística deben ser:',
      options: [
        'A. Estrictamente confidenciales y utilizarse exclusivamente para fines estadísticos.',
        'B. Públicos y accesibles a cualquier persona.',
        'C. Compartidos con otras dependencias gubernamentales para fines administrativos.',
        'D. Anónimos y de libre uso para cualquier fin.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 6. Los datos individuales que reúnan los organismos de estadística para la compilación estadística, se refieran a personas naturales o jurídicas, deben ser estrictamente confidenciales y utilizarse exclusivamente para fines estadísticos." (pág. 22)'
    },
    {
      id: 15,
      question: 'El Principio 7 se refiere a que se han de dar a conocer al público:',
      options: [
        'A. Las leyes, reglamentos y medidas que rigen la operación de los sistemas estadísticos.',
        'B. Los datos individuales de los informantes.',
        'C. Los criterios de selección de la muestra.',
        'D. Los presupuestos de los proyectos estadísticos.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 7. Se han de dar a conocer al público las leyes, reglamentos y medidas que rigen la operación de los sistemas estadísticos." (pág. 22)'
    },
    {
      id: 16,
      question: 'El Principio 8 señala que la coordinación entre los organismos de estadística a nivel nacional es indispensable para:',
      options: [
        'A. Lograr la coherencia y eficiencia del sistema estadístico.',
        'B. Aumentar el presupuesto de cada organismo.',
        'C. Reducir el número de proyectos estadísticos.',
        'D. Centralizar toda la información en una sola entidad.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 8. La coordinación entre los organismos de estadística a nivel nacional es indispensable para lograr la coherencia y eficiencia del sistema estadístico." (pág. 22)'
    },
    {
      id: 17,
      question: 'El Principio 9 promueve la utilización por los organismos de estadística de cada país de:',
      options: [
        'A. Conceptos, clasificaciones y métodos internacionales.',
        'B. Métodos exclusivamente nacionales.',
        'C. Clasificaciones propias sin referencia internacional.',
        'D. Datos de otros países sin adaptación.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 9. La utilización por los organismos de estadística de cada país de conceptos, clasificaciones y métodos internacionales fomenta la coherencia y eficiencia de los sistemas estadísticos a nivel oficial." (pág. 22)'
    },
    {
      id: 18,
      question: 'El Principio 10 se refiere a la:',
      options: [
        'A. Cooperación internacional bilateral y multilateral en la esfera de la estadística.',
        'B. Competencia entre países por la producción estadística.',
        'C. Imposición de estándares por parte de países desarrollados.',
        'D. Eliminación de la cooperación estadística entre países.'
      ],
      correct: 0,
      explanation: 'Correcto. "Principio 10. La cooperación bilateral y multilateral en la esfera de la estadística contribuye a mejorar los sistemas de estadísticas oficiales en todos los países." (pág. 22)'
    },
    // ========== Preguntas de relación ==========
    {
      id: 19,
      question: 'Relacione cada Principio Fundamental con su enunciado resumido: 1. Principio 1, 2. Principio 2, 3. Principio 3, 4. Principio 4.',
      options: [
        'A. 1-A, 2-B, 3-C, 4-D',
        'B. 1-B, 2-A, 3-D, 4-C',
        'C. 1-C, 2-D, 3-A, 4-B',
        'D. 1-D, 2-C, 3-B, 4-A'
      ],
      correct: 0,
      explanation: 'Correcto: Principio 1 = relevancia, imparcialidad y acceso equitativo (A); Principio 2 = patrones profesionales, principios científicos y ética (B); Principio 3 = responsabilidad y transparencia (C); Principio 4 = prevención del mal uso (D).'
    },
    {
      id: 20,
      question: 'Relacione los Principios 5, 6, 7 y 8 con sus definiciones: 1. Principio 5, 2. Principio 6, 3. Principio 7, 4. Principio 8.',
      options: [
        'A. 1-A, 2-B, 3-C, 4-D',
        'B. 1-B, 2-A, 3-D, 4-C',
        'C. 1-C, 2-D, 3-A, 4-B',
        'D. 1-D, 2-C, 3-B, 4-A'
      ],
      correct: 0,
      explanation: 'Correcto: Principio 5 = fuentes de estadísticas oficiales (A); Principio 6 = confidencialidad (B); Principio 7 = legislación (C); Principio 8 = coordinación nacional (D).'
    },
    {
      id: 21,
      question: 'Relacione los Principios 9 y 10 con sus enunciados: 1. Principio 9, 2. Principio 10.',
      options: [
        'A. 1-A, 2-B',
        'B. 1-B, 2-A',
        'C. 1-A, 2-A',
        'D. 1-B, 2-B'
      ],
      correct: 0,
      explanation: 'Correcto: Principio 9 = uso de patrones internacionales (A); Principio 10 = cooperación internacional (B).'
    },
    // ========== Preguntas de completar ==========
    {
      id: 22,
      question: 'Complete: "Los Principios Fundamentales de las Estadísticas Oficiales fueron aprobados por la Comisión de Estadística en ________ y reafirmados en 2013, y aprobados por la Asamblea General el 29 de enero de 2014."',
      options: [
        'A. 1994',
        'B. 2000',
        'C. 2008',
        'D. 2010'
      ],
      correct: 0,
      explanation: 'Correcto. "aprobados por la Comisión de Estadística en 1994 y reafirmados en 2013." (pág. 21)'
    },
    {
      id: 23,
      question: 'Complete: "La confianza en las estadísticas depende en gran medida del respeto de los valores y principios fundamentales que son la base de toda sociedad que procura entenderse a sí misma y respetar los derechos de sus miembros y que, en este contexto, son cruciales la ________ profesional y la rendición de cuentas de los organismos estadísticos."',
      options: [
        'A. independencia',
        'B. eficiencia',
        'C. objetividad',
        'D. transparencia'
      ],
      correct: 0,
      explanation: 'Correcto. "son cruciales la independencia profesional y la rendición de cuentas de los organismos estadísticos." (pág. 20)'
    },
    {
      id: 24,
      question: 'Complete: "El Principio 1 establece que los organismos oficiales de estadística han de compilar y facilitar en forma imparcial estadísticas oficiales de comprobada utilidad práctica para que los ciudadanos puedan ejercer su derecho a la ________."',
      options: [
        'A. información pública',
        'B. participación ciudadana',
        'C. propiedad privada',
        'D. libertad de expresión'
      ],
      correct: 0,
      explanation: 'Correcto. "para que los ciudadanos puedan ejercer su derecho a la información pública." (pág. 21)'
    },
    {
      id: 25,
      question: 'Complete: "El Principio 5 señala que los organismos de estadística han de seleccionar la fuente con respecto a la calidad, la oportunidad, el costo y la ________ que impondrá a los encuestados."',
      options: [
        'A. carga',
        'B. complejidad',
        'C. responsabilidad',
        'D. presión'

  // ============================================================
  //  LÓGICA DE LA APLICACIÓN
  // ============================================================
  let currentIndex = 0;
  let answers = new Array(questions.length).fill(null);
  let verified = new Array(questions.length).fill(false);
  let totalCorrect = 0;

  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackBox = document.getElementById('feedbackBox');
  const feedbackTitle = document.getElementById('feedbackTitle');
  const feedbackDetail = document.getElementById('feedbackDetail');
  const counterDisplay = document.getElementById('counterDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultContainer = document.getElementById('resultContainer');
  const finalScore = document.getElementById('finalScore');
  const finalMessage = document.getElementById('finalMessage');

  function renderQuestion(index) {
    const q = questions[index];
    questionText.textContent = q.question;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question';
      radio.value = i;
      radio.checked = (answers[index] === i);
      radio.addEventListener('change', () => {
        if (verified[index]) {
          verified[index] = false;
          feedbackBox.style.display = 'none';
          totalCorrect = computeTotalCorrect();
        }
        answers[index] = i;
        renderQuestion(index);
      });
      const label = document.createElement('label');
      label.textContent = opt;
      div.appendChild(radio);
      div.appendChild(label);
      optionsContainer.appendChild(div);
    });

    counterDisplay.textContent = `${index+1} / ${questions.length}`;
    if (verified[index]) {
      statusDisplay.textContent = '✅ Verificada';
    } else if (answers[index] !== null) {
      statusDisplay.textContent = '⚪ Respondida (sin verificar)';
    } else {
      statusDisplay.textContent = '🔘 Sin responder';
    }

    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === questions.length - 1);

    if (verified[index]) {
      const q = questions[index];
      const isCorrect = (answers[index] === q.correct);
      feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
      feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
      feedbackDetail.innerHTML = q.explanation;
      feedbackBox.style.display = 'block';
    } else {
      feedbackBox.style.display = 'none';
    }

    resultContainer.classList.add('hidden');
  }

  function computeTotalCorrect() {
    let count = 0;
    for (let i = 0; i < questions.length; i++) {
      if (verified[i] && answers[i] === questions[i].correct) count++;
    }
    return count;
  }

  function verifyCurrent() {
    const idx = currentIndex;
    const q = questions[idx];
    if (answers[idx] === null) {
      alert('Por favor, selecciona una opción antes de verificar.');
      return;
    }
    const isCorrect = (answers[idx] === q.correct);
    verified[idx] = true;
    totalCorrect = computeTotalCorrect();

    feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
    feedbackDetail.innerHTML = q.explanation;
    feedbackBox.style.display = 'block';

    renderQuestion(idx);
    statusDisplay.textContent = '✅ Verificada';
  }

  function showFinalResults() {
    const total = questions.length;
    let correct = 0;
    for (let i = 0; i < total; i++) {
      if (verified[i] && answers[i] === questions[i].correct) correct++;
    }
    const percent = Math.round((correct / total) * 100);
    finalScore.textContent = percent + '%';
    let msg = '';
    if (percent >= 90) msg = '¡Excelente! Dominas los conceptos sobre la importancia de la estadística y los estándares internacionales.';
    else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
    else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y los principios.';
    else msg = 'Te sugerimos estudiar nuevamente el capítulo y volver a intentarlo.';
    finalMessage.textContent = msg;
    resultContainer.classList.remove('hidden');
  }

  function resetQuiz() {
    answers.fill(null);
    verified.fill(false);
    currentIndex = 0;
    totalCorrect = 0;
    feedbackBox.style.display = 'none';
    resultContainer.classList.add('hidden');
    renderQuestion(0);
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion(currentIndex);
    } else {
      showFinalResults();
    }
  });

  verifyBtn.addEventListener('click', verifyCurrent);
  resetBtn.addEventListener('click', resetQuiz);

  renderQuestion(0);
</script>
