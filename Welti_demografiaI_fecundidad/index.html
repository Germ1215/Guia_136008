<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoevaluación: Fecundidad (Demografía I)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
      padding: 32px 40px;
      transition: 0.25s;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2b4a;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .subtitle {
      color: #2c5778;
      font-size: 0.95rem;
      border-left: 4px solid #2a7faa;
      padding-left: 16px;
      margin-bottom: 28px;
      background: #eef3f9;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 0.9rem;
      color: #1a405a;
      border-bottom: 1px solid #dce5ed;
      padding-bottom: 14px;
    }
    .question-counter {
      font-weight: 600;
      background: #dce5ed;
      padding: 4px 14px;
      border-radius: 30px;
    }
    .question-box {
      margin-bottom: 30px;
    }
    .qtext {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.6;
      color: #0b2b4a;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e9f2;
      border-radius: 16px;
      padding: 14px 20px;
      transition: 0.15s;
      cursor: pointer;
    }
    .option-item:hover {
      background: #eef4fa;
      border-color: #b0c8dd;
    }
    .option-item.selected {
      background: #e0edf9;
      border-color: #2a7faa;
      box-shadow: 0 0 0 2px rgba(42,127,170,0.15);
    }
    .option-item input[type="radio"] {
      margin-top: 4px;
      accent-color: #1f6e96;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .option-item label {
      font-size: 1rem;
      line-height: 1.5;
      color: #1a334a;
      cursor: pointer;
      flex: 1;
    }
    .feedback-box {
      background: #f0f6fe;
      border-radius: 20px;
      padding: 18px 24px;
      margin: 16px 0 28px 0;
      border-left: 5px solid #2a7faa;
      display: none;
    }
    .feedback-box.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
    }
    .feedback-box.incorrect {
      border-left-color: #c74545;
      background: #fdeeec;
    }
    .feedback-box .fb-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .feedback-box .fb-detail {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #1a334a;
    }
    .feedback-box .fb-detail strong {
      color: #0b2b4a;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: white;
      border: 1.5px solid #b8cdde;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1a405a;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f9fbfd;
    }
    .btn:hover:not(:disabled) {
      background: #e2ecf5;
      border-color: #7fa3be;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1a5f82;
      border-color: #1a5f82;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #134b68;
      border-color: #134b68;
    }
    .btn-outline {
      background: transparent;
      border-color: #b0c8dd;
    }
    .btn-success {
      background: #1f8b4c;
      border-color: #1f8b4c;
      color: white;
    }
    .btn-success:hover:not(:disabled) {
      background: #17733e;
      border-color: #17733e;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .result-summary {
      background: #e2ecf5;
      border-radius: 24px;
      padding: 20px 28px;
      text-align: center;
      margin-top: 16px;
    }
    .result-summary .score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0b2b4a;
    }
    .result-summary .label {
      font-size: 1rem;
      color: #1a405a;
    }
    .hidden {
      display: none !important;
    }
    .mt-2 { margin-top: 12px; }
    .text-muted { color: #4a6a82; }
    @media (max-width: 600px) {
      .container { padding: 24px 18px; }
      h1 { font-size: 1.5rem; }
      .qtext { font-size: 1.05rem; }
      .option-item { padding: 12px 16px; }
      .btn { padding: 8px 18px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>📘 Autoevaluación · Fecundidad</h1>
  <div class="subtitle">Capítulo V — Demografía I (Welti, 1997) &nbsp;|&nbsp; 50 preguntas de opción múltiple</div>

  <div class="progress">
    <span class="question-counter" id="counterDisplay">1 / 50</span>
    <span id="statusDisplay" style="font-weight: 500;">Responde y verifica</span>
  </div>

  <!-- Pregunta -->
  <div class="question-box" id="questionContainer">
    <div class="qtext" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <!-- Feedback -->
  <div class="feedback-box" id="feedbackBox">
    <div class="fb-title" id="feedbackTitle"></div>
    <div class="fb-detail" id="feedbackDetail"></div>
  </div>

  <!-- Navegación -->
  <div class="nav-buttons">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn" disabled>◀ Anterior</button>
      <button class="btn btn-outline" id="nextBtn">Siguiente ▶</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="verifyBtn">✓ Verificar</button>
      <button class="btn btn-success" id="resetBtn" style="background:#5a6f82;border-color:#5a6f82;">⟳ Reiniciar</button>
    </div>
  </div>

  <!-- Resultado final -->
  <div id="resultContainer" class="hidden result-summary">
    <div class="label">Porcentaje de aciertos</div>
    <div class="score" id="finalScore">0%</div>
    <div style="margin-top: 8px; font-size:0.95rem;" id="finalMessage"></div>
  </div>
</div>
<script>
  // ----------------------------------------------------------------
  //  BASE DE PREGUNTAS (50) – extraídas rigurosamente del documento
  // ----------------------------------------------------------------
  const questions = [
    // ========== V.1.a Nociones básicas ==========
    {
      id: 1,
      question: 'Según el texto, la reproducción intergeneracional se define como:',
      options: [
        'A. El mantenimiento de condiciones de vida que permiten la supervivencia de los individuos.',
        'B. La creación de nuevos individuos para garantizar que la población no se extinga en el tiempo.',
        'C. La fusión de un espermatozoide con un óvulo para iniciar un embarazo.',
        'D. El conjunto de normas y pautas de acción social que una sociedad adopta sobre la procreación.'
      ],
      correct: 1,
      explanation: 'Correcto. La reproducción intergeneracional es "la creación de nuevos individuos, siendo la única forma de garantizar que la población no se extinga en el tiempo" (pág. 2). La opción A describe la reproducción cotidiana; C es el proceso biológico; D es el comportamiento reproductivo.'
    },
    {
      id: 2,
      question: 'La reproducción cotidiana consiste en:',
      options: [
        'A. La formación de nuevas generaciones a través del nacimiento de hijos.',
        'B. Mantener las condiciones de alimentación, hábitat y control de enfermedades para la sobrevivencia.',
        'C. La capacidad biológica de las mujeres para concebir.',
        'D. La práctica de infanticidio en periodos de hambruna.'
      ],
      correct: 1,
      explanation: 'Correcto. La reproducción cotidiana "consiste en mantener un conjunto de condiciones (alimentación, hábitat, control de enfermedades, etc.) que permiten la sobrevivencia de los individuos" (pág. 1). Las otras opciones no corresponden.'
    },
    {
      id: 3,
      question: 'Según el texto, la relación entre reproducción cotidiana e intergeneracional es que:',
      options: [
        'A. Son procesos independientes y no se influyen mutuamente.',
        'B. La reproducción cotidiana permite la reproducción intergeneracional al retardar la muerte y posibilitar que las personas lleguen a la edad de procrear.',
        'C. La reproducción intergeneracional es más importante, por lo que la cotidiana siempre queda en segundo plano.',
        'D. Ambas son formas de reproducción que ocurren simultáneamente sin prioridad en ninguna situación.'
      ],
      correct: 1,
      explanation: 'Correcto. El documento señala: "Esta [reproducción cotidiana], al retardar la muerte, permite que la reproducción intergeneracional sea posible" (pág. 2). Las demás opciones ignoran la relación de dependencia planteada.'
    },
    {
      id: 4,
      question: 'El ejemplo de los esquimales que abandonaban a los viejos se utiliza para ilustrar que:',
      options: [
        'A. La reproducción intergeneracional prevalece sobre la sobrevivencia individual en situaciones extremas.',
        'B. La sobrevivencia del grupo puede primar sobre la sobrevivencia individual, garantizando la reproducción intergeneracional.',
        'C. La reproducción cotidiana siempre es sacrificada en favor de la intergeneracional.',
        'D. Los ancianos eran considerados una carga y se les abandonaba por motivos morales.'
      ],
      correct: 1,
      explanation: 'Correcto. El texto dice: "Tal actitud contraria a la sobrevivencia de ciertos individuos del grupo era, entonces, una acción tomada con el fin de garantizar la sobrevivencia cotidiana de la mayoría y, al mismo tiempo, la reproducción intergeneracional de éste" (pág. 2). La opción A invierte el énfasis; C es demasiado general; D es incorrecta.'
    },

    // ========== V.1.b Fecundidad como fenómeno biológico y social ==========
    {
      id: 5,
      question: 'Desde la perspectiva demográfica, la reproducción se estudia principalmente como:',
      options: [
        'A. Un proceso biológico determinado por la fusión de gametos.',
        'B. Un hecho social, en el que los nacimientos son el resultado de condiciones económicas, culturales y políticas.',
        'C. Un instinto natural que no admite mediación social.',
        'D. Un fenómeno exclusivamente individual sin repercusiones poblacionales.'
      ],
      correct: 1,
      explanation: 'Correcto. "Desde el punto de vista demográfico, sin embargo, el foco de la investigación no está tanto en los aspectos biológicos de la reproducción sino en su resultado: los nacimientos. ... la reproducción es estudiada como un hecho social" (pág. 2).'
    },
    {
      id: 6,
      question: 'Según Vieira Pinto, el acto reproductivo en la especie humana:',
      options: [
        'A. Se ejerce en su inmediata espontaneidad biológica.',
        'B. Se realiza a través de la mediación social que impone las condiciones de existencia.',
        'C. No tiene relación con el medio social, solo con el biológico.',
        'D. Es idéntico a la reproducción animal.'
      ],
      correct: 1,
      explanation: 'Correcto. Vieira Pinto señala que "el acto instintivo de la reproducción no se ejerce en su inmediata espontaneidad, sino a través de la mediación social que existe para imponer al hombre las condiciones en que tiene que desempeñar las condiciones de su propia existencia" (pág. 2).'
    },

    // ========== V.1.c Definición de conceptos ==========
    {
      id: 7,
      question: 'En demografía, el término "fecundidad" se refiere a:',
      options: [
        'A. La capacidad biológica de una mujer para concebir.',
        'B. El conjunto de fenómenos cuantitativos directamente ligados a la procreación, especialmente el número de nacimientos en una población.',
        'C. La probabilidad de concebir durante el ciclo menstrual.',
        'D. El número de nacimientos por cada mil habitantes en un año.'
      ],
      correct: 1,
      explanation: 'Correcto. Henry define fecundidad como "el conjunto de fenómenos cuantitativos directamente ligados a la procreación" (pág. 3). La opción A es fertilidad; C es fecundabilidad; D es tasa bruta de natalidad.'
    },
    {
      id: 8,
      question: 'La "fertilidad" se define como:',
      options: [
        'A. La capacidad efectiva de producir un nacimiento vivo.',
        'B. La capacidad biológica de una mujer, hombre o pareja de engendrar un hijo.',
        'C. El número de hijos que tiene una mujer en su vida fértil.',
        'D. La probabilidad de concebir en un ciclo menstrual.'
      ],
      correct: 1,
      explanation: 'Correcto. "El concepto de fertilidad, por su parte, se refiere a la capacidad biológica de una mujer, hombre o pareja de engendrar un hijo" (pág. 3). La opción A es fecundidad; C es paridez; D es fecundabilidad.'
    },
    {
      id: 9,
      question: 'La "fecundabilidad" se define como:',
      options: [
        'A. La probabilidad que tiene una mujer de concebir durante la etapa fértil de su ciclo menstrual, excluyendo periodos de gestación y esterilidad postparto.',
        'B. La incapacidad permanente de tener hijos.',
        'C. El resultado efectivo de nacimientos en una población.',
        'D. La capacidad biológica de procrear.'
      ],
      correct: 0,
      explanation: 'Correcto. "Fecundabilidad es la probabilidad que tiene una mujer de concebir durante la etapa de su ciclo menstrual en que es fértil, excluyendo los periodos de gestación y de esterilidad temporal que siguen a un embarazo" (pág. 3).'
    },
    {
      id: 10,
      question: 'La diferencia entre fecundidad y natalidad es que:',
      options: [
        'A. La fecundidad mide la capacidad biológica, mientras que la natalidad mide el resultado efectivo.',
        'B. La fecundidad se refiere al número de hijos por mujer, mientras que la natalidad relaciona los nacimientos con la población total.',
        'C. Ambos conceptos son sinónimos y se usan indistintamente.',
        'D. La natalidad excluye los nacimientos femeninos, mientras que la fecundidad los incluye.'
      ],
      correct: 1,
      explanation: 'Correcto. "La fecundidad se relaciona con la cantidad de hijos que cada mujer tiene en su vida fértil, y la natalidad se vincula con la cantidad de nacimientos ocurridos, en cierto periodo, en una población con relación al total de personas que la componen" (pág. 3).'
    },
    {
      id: 11,
      question: 'La infertilidad primaria se define como:',
      options: [
        'A. La imposibilidad de concebir después del nacimiento de al menos un hijo.',
        'B. La imposibilidad permanente y desde antes de la menarquia de tener hijos.',
        'C. La ausencia de reglas durante el embarazo.',
        'D. La probabilidad de no concebir en un ciclo menstrual.'
      ],
      correct: 1,
      explanation: 'Correcto. "Se habla de infertilidad total o primaria cuando existe la imposibilidad, permanente y desde antes de la menarquia, de tener hijos" (pág. 3). La opción A es infertilidad secundaria; C es amenorrea; D no es una definición del texto.'
    },

    // ========== V.2.a Fuentes de datos ==========
    {
      id: 12,
      question: 'Las fuentes tradicionales para el estudio de la fecundidad son:',
      options: [
        'A. Encuestas demográficas y registros parroquiales.',
        'B. Estadísticas vitales y censos de población.',
        'C. Encuestas de salud y entrevistas cualitativas.',
        'D. Proyecciones poblacionales y modelos matemáticos.'
      ],
      correct: 1,
      explanation: 'Correcto. "Las fuentes de datos tradicionales para el estudio de la fecundidad son las estadísticas vitales y los censos de población" (pág. 4).'
    },
    {
      id: 13,
      question: 'El programa PECFAL (Programa de Encuestas Comparativas de Fecundidad en América Latina) fue impulsado por:',
      options: [
        'A. El Instituto Internacional de Estadística (ISI).',
        'B. El CELADE (Centro Latinoamericano de Demografía).',
        'C. La USAID (Agencia de los EE.UU. para el Desarrollo Internacional).',
        'D. La Organización Mundial de la Salud (OMS).'
      ],
      correct: 1,
      explanation: 'Correcto. "El CELADE inicia este programa de encuestas PECFAL" (pág. 5).'
    },
    {
      id: 14,
      question: 'La Encuesta Mundial de Fecundidad (WFS) se caracteriza por:',
      options: [
        'A. Haber sido aplicada exclusivamente en países desarrollados.',
        'B. Recoger datos comparables a nivel internacional usando un cuestionario base prácticamente idéntico en 62 países.',
        'C. Centrarse únicamente en el uso de anticonceptivos.',
        'D. Haber sido coordinada por el CELADE.'
      ],
      correct: 1,
      explanation: 'Correcto. La WFS "se realizó usando un cuestionario base prácticamente idéntico en 62 países: 42 países subdesarrollados y 20 desarrollados" (pág. 6).'
    },
    {
      id: 15,
      question: 'Las encuestas DHS (Demographic and Health Surveys) se distinguen de la WFS principalmente porque:',
      options: [
        'A. No incluyen preguntas sobre anticoncepción.',
        'B. Tienen un módulo central sobre salud materno-infantil.',
        'C. Se aplican solo en América Latina.',
        'D. No recogen historia de embarazos.'
      ],
      correct: 1,
      explanation: 'Correcto. "Estas encuestas, a diferencia de la EMF, tienen como módulo central un conjunto de preguntas sobre salud materno-infantil" (pág. 7).'
    },
    {
      id: 16,
      question: 'Entre las limitaciones de los censos para el análisis de la fecundidad se encuentran:',
      options: [
        'A. La falta de preguntas sobre nacimientos.',
        'B. La subnumeración y la mala declaración de la edad.',
        'C. El registro tardío de los nacimientos.',
        'D. La falta de cobertura geográfica.'
      ],
      correct: 1,
      explanation: 'Correcto. "Las limitaciones principales que éstos suelen presentar para el análisis de la fecundidad son la subnumeración y la mala declaración de la edad" (pág. 5).'
    },

    // ========== V.3.a Introducción a la medición ==========
    {
      id: 17,
      question: 'En el estudio de la fecundidad, el análisis transversal se refiere a:',
      options: [
        'A. Estudiar la fecundidad de una misma cohorte a lo largo de su vida fértil.',
        'B. Estudiar la fecundidad en un periodo de tiempo determinado (generalmente un año) para diferentes grupos de edad.',
        'C. Seguir a las mismas mujeres durante toda su vida reproductiva.',
        'D. Calcular la paridez final de una generación.'
      ],
      correct: 1,
      explanation: 'Correcto. "El análisis transversal estudia la fecundidad a partir de la experiencia de las mujeres de diferentes edades en un momento dado (o periodo)" (pág. 9). Las opciones A y C son longitudinales.'
    },
    {
      id: 18,
      question: 'El análisis longitudinal de la fecundidad se caracteriza por:',
      options: [
        'A. Utilizar datos de un solo año calendario.',
        'B. Seguir la experiencia real de una cohorte de mujeres durante toda su vida fértil.',
        'C. Calcular tasas específicas por edad para un año dado.',
        'D. Estar menos afectado por cambios en el calendario reproductivo.'
      ],
      correct: 1,
      explanation: 'Correcto. "En el análisis longitudinal, en cambio, se estudia la fecundidad siguiendo la experiencia real de un grupo de mujeres durante toda la vida fértil" (pág. 10).'
    },

    // ========== V.3.b Tasa bruta de natalidad ==========
    {
      id: 19,
      question: 'La tasa bruta de natalidad se calcula como:',
      options: [
        'A. (Nacimientos ocurridos en un año / Población femenina de 15-49 años) × 1000.',
        'B. (Nacimientos ocurridos en un año / Población total a mitad de año) × 1000.',
        'C. (Nacimientos femeninos / Población total) × 1000.',
        'D. (Nacimientos ocurridos / Población total al inicio del año) × 1000.'
      ],
      correct: 1,
      explanation: 'Correcto. "La tasa bruta de natalidad (b), se calcula como b = (B_z / N_z) × 1000" donde B_z son nacimientos ocurridos en el año y N_z población total a mitad de año (pág. 10).'
    },
    {
      id: 20,
      question: 'La tasa bruta de natalidad tiene la ventaja de:',
      options: [
        'A. No estar afectada por la estructura por edad de la población.',
        'B. Ser sencilla y comparable con tasas de mortalidad y migración porque usa el mismo denominador.',
        'C. Medir exclusivamente la fecundidad de las mujeres en edad fértil.',
        'D. Ser un indicador preciso de las diferencias de fecundidad entre países.'
      ],
      correct: 1,
      explanation: 'Correcto. "La tasa bruta de natalidad tiene la ventaja de ser una medida sencilla y fácil de calcular e interpretar... es directamente comparable con las tasas de mortalidad, migración y crecimiento de la población, ya que cada una de estas tasas usa el mismo denominador" (pág. 11).'
    },
    {
      id: 21,
      question: 'Una limitación principal de la tasa bruta de natalidad como indicador de la fecundidad es que:',
      options: [
        'A. No considera la mortalidad femenina.',
        'B. Está influida por la estructura por sexo y edad de la población.',
        'C. Solo incluye nacimientos femeninos.',
        'D. No permite comparar poblaciones con diferente tamaño.'
      ],
      correct: 1,
      explanation: 'Correcto. "La limitación principal de esta tasa se presenta cuando quiere usársele en la medición de las diferencias de fecundidad entre dos o más poblaciones que tienen diferente estructura por sexo y edad" (pág. 11).'
    },

    // ========== V.3.c Tasa de fecundidad general ==========
    {
      id: 22,
      question: 'La tasa de fecundidad general (TFG) se define como:',
      options: [
        'A. El cociente entre nacimientos ocurridos en un año y la población total, por mil.',
        'B. El cociente entre nacimientos ocurridos en un año y la población femenina en edad fértil (15-49 años), por mil.',
        'C. La suma de las tasas específicas de fecundidad por edad.',
        'D. El número medio de hijos por mujer al final de la vida fértil.'
      ],
      correct: 1,

  // ============================================================
  //  LÓGICA DE LA APLICACIÓN
  // ============================================================
  let currentIndex = 0;
  let answers = new Array(questions.length).fill(null); // índice de opción seleccionada
  let verified = new Array(questions.length).fill(false);
  let totalCorrect = 0;

  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackBox = document.getElementById('feedbackBox');
  const feedbackTitle = document.getElementById('feedbackTitle');
  const feedbackDetail = document.getElementById('feedbackDetail');
  const counterDisplay = document.getElementById('counterDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultContainer = document.getElementById('resultContainer');
  const finalScore = document.getElementById('finalScore');
  const finalMessage = document.getElementById('finalMessage');

  function renderQuestion(index) {
    const q = questions[index];
    questionText.textContent = q.question;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option-item' + (answers[index] === i ? ' selected' : '');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question';
      radio.value = i;
      radio.checked = (answers[index] === i);
      radio.addEventListener('change', () => {
        if (verified[index]) {
          // si ya está verificado, no permitir cambiar? mejor se permite pero se resetea verificación?
          // Decido: si cambia respuesta, se desmarca verificado para esa pregunta.
          if (verified[index]) {
            verified[index] = false;
            feedbackBox.style.display = 'none';
            totalCorrect = computeTotalCorrect();
          }
        }
        answers[index] = i;
        renderQuestion(index);
      });
      const label = document.createElement('label');
      label.textContent = opt;
      div.appendChild(radio);
      div.appendChild(label);
      optionsContainer.appendChild(div);
    });

    // actualizar contador
    counterDisplay.textContent = `${index+1} / ${questions.length}`;
    // estado
    if (verified[index]) {
      statusDisplay.textContent = '✅ Verificada';
    } else if (answers[index] !== null) {
      statusDisplay.textContent = '⚪ Respondida (sin verificar)';
    } else {
      statusDisplay.textContent = '🔘 Sin responder';
    }

    // botones
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === questions.length - 1);

    // feedback (si ya estaba verificado)
    if (verified[index]) {
      const q = questions[index];
      const isCorrect = (answers[index] === q.correct);
      feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
      feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
      feedbackDetail.innerHTML = q.explanation;
      feedbackBox.style.display = 'block';
    } else {
      feedbackBox.style.display = 'none';
    }

    // ocultar resultado final si estamos en medio
    resultContainer.classList.add('hidden');
  }

  function computeTotalCorrect() {
    let count = 0;
    for (let i = 0; i < questions.length; i++) {
      if (verified[i] && answers[i] === questions[i].correct) count++;
    }
    return count;
  }

  function verifyCurrent() {
    const idx = currentIndex;
    const q = questions[idx];
    if (answers[idx] === null) {
      alert('Por favor, selecciona una opción antes de verificar.');
      return;
    }
    const isCorrect = (answers[idx] === q.correct);
    verified[idx] = true;
    totalCorrect = computeTotalCorrect();

    // mostrar feedback
    feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    feedbackTitle.textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
    feedbackDetail.innerHTML = q.explanation;
    feedbackBox.style.display = 'block';

    renderQuestion(idx);
    // actualizar estado
    statusDisplay.textContent = '✅ Verificada';
  }

  function showFinalResults() {
    const total = questions.length;
    let correct = 0;
    for (let i = 0; i < total; i++) {
      if (verified[i] && answers[i] === questions[i].correct) correct++;
    }
    const percent = Math.round((correct / total) * 100);
    finalScore.textContent = percent + '%';
    let msg = '';
    if (percent >= 90) msg = '¡Excelente! Dominas los conceptos de fecundidad.';
    else if (percent >= 70) msg = 'Buen trabajo, revisa los temas en los que fallaste.';
    else if (percent >= 50) msg = 'Es recomendable repasar las definiciones y fórmulas.';
    else msg = 'Te sugerimos estudiar nuevamente el capítulo y volver a intentarlo.';
    finalMessage.textContent = msg;
    resultContainer.classList.remove('hidden');
    // ocultar navegación? no, pero se puede dejar
  }

  function resetQuiz() {
    answers.fill(null);
    verified.fill(false);
    currentIndex = 0;
    totalCorrect = 0;
    feedbackBox.style.display = 'none';
    resultContainer.classList.add('hidden');
    renderQuestion(0);
  }

  // Event listeners
  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion(currentIndex);
    } else {
      // si estamos en la última, mostrar resultados
      showFinalResults();
    }
  });

  verifyBtn.addEventListener('click', verifyCurrent);

  resetBtn.addEventListener('click', resetQuiz);

  // Inicializar
  renderQuestion(0);
